<script>
// --- KONFIGURASI PEERJS & NETWORK ---
let peer = null;
let conn = null;
let myPeerID = null;
let isHost = false;
const ID_PREFIX = "neon-rift-v2-";

// --- KONFIGURASI CANVAS & GAME ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;
let particles = [];
let floatingTexts = [];

// Game Constants
const SUITS = ['fire', 'water', 'leaf', 'moon']; // Added Moon
const COLORS = {
    fire: '#FF2222',
    water: '#0088FF',
    leaf: '#00CC44',
    moon: '#9D00FF', // Purple for Moon
    cardBg: '#FFFFFF',
    cardBack: '#1a1a1a',
    cardBackOutline: '#00FFFF'
};
const COUNTER_MAP = { fire: 'leaf', leaf: 'water', water: 'fire', moon: 'all' };

// Game State
let deck = [];
let discardPile = [];
let myHand = [];
let opponentHand = []; 
let turn = ''; 
let gameState = 'MENU'; 
let isAnimating = false; 

// Moon & Eclipse Special State
let isChoosingFollowUp = false; // Player harus menaruh kartu kedua setelah Moon
let eclipseMode = false;        // Status apakah layar sedang gelap
let eclipseAlpha = 0;           // Transparansi kegelapan
let moonCardRef = null;         // Referensi kartu moon yang sedang dimainkan

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let t = audioCtx.currentTime;
    
    if (type === 'play') {
        osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'deal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t + 0.08);
        osc.start(); osc.stop(t + 0.08);
    } else if (type === 'moon') {
        // Suara misterius untuk Moon Card
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(100, t); osc.frequency.linearRampToValueAtTime(50, t + 1.0);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t + 1.5);
        osc.start(); osc.stop(t + 1.5);
    } else if (type === 'crit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(600, t + 0.3);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(); osc.stop(t + 0.3);
    }
}

// --- CLASS DEFINITIONS ---
class Card {
    constructor(suit, value) {
        this.suit = suit; this.value = value;
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = 60; this.y = height/2; 
        this.targetX = width / 2; this.targetY = height / 2;
        this.width = 0; this.height = 0;
        this.isHovered = false;
        this.rotation = 0;
    }

    draw(ctx, isFaceUp, x, y, w, h) {
        this.x += (this.targetX - this.x) * 0.15;
        this.y += (this.targetY - this.y) * 0.15;

        const drawX = x !== undefined ? x : this.x;
        const drawY = y !== undefined ? y : this.y;
        const drawW = w || this.width;
        const drawH = h || this.height;
        const r = 10;

        ctx.save();
        ctx.translate(drawX, drawY);

        if (isFaceUp) {
            // Moon Card Special Style
            if(this.suit === 'moon') {
                ctx.fillStyle = '#1a0033'; // Dark purple bg
                ctx.strokeStyle = '#D800FF'; // Neon purple outline
            } else {
                ctx.fillStyle = COLORS.cardBg;
                ctx.strokeStyle = COLORS[this.suit];
            }
            
            ctx.lineWidth = 2;
            ctx.shadowColor = this.suit === 'moon' ? 'rgba(216, 0, 255, 0.6)' : 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = this.isHovered || this.suit === 'moon' ? 20 : 5;
            ctx.shadowOffsetY = 3;

            roundRect(ctx, -drawW/2, -drawH/2, drawW, drawH, r);
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

            drawElementIcon(ctx, this.suit, 0, 0, drawW * 0.35);

            ctx.fillStyle = this.suit === 'moon' ? '#D800FF' : COLORS[this.suit];
            ctx.font = `bold ${drawW * 0.25}px Orbitron`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            // Moon doesn't show number usually, but for logic consistency we keep rendering or hide
            if(this.suit !== 'moon') {
                ctx.fillText(this.value, drawW/2 - 20, -drawH/2 + 25);
                ctx.fillText(this.value, -drawW/2 + 20, drawH/2 - 25);
            } else {
                ctx.font = `bold ${drawW * 0.20}px Orbitron`;
                ctx.fillText("☾", drawW/2 - 20, -drawH/2 + 25);
                ctx.fillText("☾", -drawW/2 + 20, drawH/2 - 25);
            }

        } else {
            ctx.fillStyle = COLORS.cardBack;
            ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
            roundRect(ctx, -drawW/2, -drawH/2, drawW, drawH, r);
            ctx.fill(); ctx.stroke();
            ctx.strokeStyle = COLORS.cardBackOutline; ctx.lineWidth = 2;
            ctx.beginPath();
            let pad = 8;
            ctx.roundRect(-drawW/2 + pad, -drawH/2 + pad, drawW - pad*2, drawH - pad*2, r/2);
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(10, 10); ctx.moveTo(10, -10); ctx.lineTo(-10, 10); ctx.stroke();
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color, isMoonEffect) {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1;
        this.isMoonEffect = isMoonEffect || false;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life -= this.isMoonEffect ? 0.01 : 0.03; // Moon particles last longer
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill(); ctx.globalAlpha = 1;
    }
}

// --- FUNGSI LOBBY & NETWORK ---

function showLoading(msg) {
    document.getElementById('loading-layer').style.display = 'flex';
    document.getElementById('loading-msg').innerText = msg;
}
function hideLoading() {
    document.getElementById('loading-layer').style.display = 'none';
}

function checkFullscreenRequirement() {
    const chk = document.getElementById('fs-check');
    const btn = document.getElementById('start-btn');
    if(chk.checked) {
        btn.classList.add('active');
        btn.disabled = false;
    } else {
        btn.classList.remove('active');
        btn.disabled = true;
    }
}

function goToLobby() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen().catch(err => {});
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('lobby-screen').classList.remove('hidden');
}

function createRoom() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    const fullID = ID_PREFIX + code;
    showLoading("CREATING ROOM...");
    peer = new Peer(fullID);
    
    peer.on('open', (id) => {
        hideLoading();
        isHost = true;
        myPeerID = id;
        document.getElementById('lobby-main').classList.add('hidden');
        document.getElementById('lobby-wait').classList.remove('hidden');
        document.getElementById('host-room-code').innerText = code;
    });

    peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        showFloatingText("PLAYER JOINED!", width/2, height/2, "#0f0");
        setTimeout(startMultiplayerGame, 1000);
    });

    peer.on('error', (err) => {
        hideLoading();
        alert("Error creating room: " + err);
        resetLobby();
    });
}

function showJoinUI() {
    document.getElementById('lobby-main').classList.add('hidden');
    document.getElementById('lobby-join').classList.remove('hidden');
}

function joinRoom() {
    const input = document.getElementById('join-code-input').value;
    if (input.length !== 4) { alert("Enter 4 digits code!"); return; }
    showLoading("JOINING ROOM...");
    const targetID = ID_PREFIX + input;
    peer = new Peer(); 
    peer.on('open', () => {
        conn = peer.connect(targetID);
        setupConnection();
    });
    peer.on('error', (err) => {
        hideLoading();
        alert("Room not found!");
        resetLobby();
    });
}

function resetLobby() {
    if(peer) peer.destroy();
    peer = null; conn = null;
    document.getElementById('lobby-main').classList.remove('hidden');
    document.getElementById('lobby-wait').classList.add('hidden');
    document.getElementById('lobby-join').classList.add('hidden');
    hideLoading();
}

function setupConnection() {
    conn.on('open', () => { console.log("Connected"); });
    conn.on('data', (data) => { handleNetworkData(data); });
    conn.on('close', () => { endGame("DISCONNECTED", "Opponent left the game"); });
}

// --- DATA HANDLING ---
function handleNetworkData(data) {
    if (data.type === 'START_GAME') {
        document.getElementById('lobby-screen').classList.add('hidden');
        hideLoading();
        gameState = 'PLAYING';
        
        turn = data.turn === 'p2' ? 'me' : 'opponent';

        let myStartCards = data.p2Hand.map(c => new Card(c.suit, c.value));
        let oppStartCount = data.p1HandCount;
        let topCard = new Card(data.topDiscard.suit, data.topDiscard.value);

        playDealAnimation(myStartCards, oppStartCount, topCard);
    
    } else if (data.type === 'OPPONENT_MOVE') {
        // Jika lawan main kartu biasa
        processOpponentMove(data.card, data.isCrit);
        if(eclipseMode) deactivateEclipse(); // Jika lawan berhasil menebak dalam gelap

    } else if (data.type === 'OPPONENT_MOON_COMBO') {
        // Lawan main MOON + Follow Up
        processOpponentMoonCombo(data.moonCard, data.followUpCard);

    } else if (data.type === 'OPPONENT_DRAW') {
        let c = new Card('fire', 1);
        c.x = 60; c.y = height/2;
        opponentHand.push(c);
        playSound('deal');
        showFloatingText("Opponent Drew", width/2, 100, "#aaa");
        turn = 'me';
        showFloatingText("YOUR TURN", width/2, height/2 + 100, "#0f0");
        if(eclipseMode) deactivateEclipse(); // Giliran lewat, gelap hilang

    } else if (data.type === 'EXTRA_CARD') {
        // Penalty
        let c = data.card;
        let nc = new Card(c.suit, c.value);
        nc.x = 60; nc.y = height/2;
        nc.targetX = width/2; nc.targetY = -200;
        myHand.push(nc);
        playSound('deal');
        showFloatingText("Penalty!", width/2, height/2+50, "red");

    } else if (data.type === 'PENALTY_SYNC') {
        let c = new Card('fire', 1);
        c.x = 60; c.y = height/2; 
        opponentHand.push(c); 
        playSound('deal');
        showFloatingText("Opponent Penalized!", width/2, 100, "red");
    } else if (data.type === 'SKIP_TURN_FAIL') {
        // Lawan gagal menebak saat eclipse
        showFloatingText("BLOCKED!", width/2, height/2, "#9D00FF");
        deactivateEclipse();
        turn = 'me'; // Balik lagi ke saya
    }
}

// --- GAME LOGIC & ANIMATION ---

function startMultiplayerGame() {
    document.getElementById('lobby-screen').classList.add('hidden');
    gameState = 'PLAYING';

    let realDeck = [];
    SUITS.forEach(suit => {
        if(suit === 'moon') return; // Skip moon in loop, add manually
        for (let i = 1; i <= 9; i++) {
            realDeck.push({suit, value: i});
            if(i <= 5) realDeck.push({suit, value: i});
        }
    });
    
    // Add 2 Moon Cards
    realDeck.push({suit: 'moon', value: 99});
    realDeck.push({suit: 'moon', value: 99});

    // Shuffle
    for (let i = realDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [realDeck[i], realDeck[j]] = [realDeck[j], realDeck[i]]; }

    let p1H = realDeck.splice(0, 6); // Host (Me)
    let p2H = realDeck.splice(0, 6); // Client
    
    // Ensure top card is not Moon
    let top = realDeck.pop();
    while(top.suit === 'moon') {
        realDeck.unshift(top);
        top = realDeck.pop();
    }
    
    let myStartCards = p1H.map(c => new Card(c.suit, c.value));
    let topCardObj = new Card(top.suit, top.value);

    turn = Math.random() > 0.5 ? 'me' : 'opponent';

    conn.send({
        type: 'START_GAME',
        deckCount: realDeck.length,
        topDiscard: top,
        p1HandCount: 6,
        p2Hand: p2H, 
        turn: turn === 'me' ? 'p1' : 'p2'
    });

    playDealAnimation(myStartCards, 6, topCardObj);
}

function playDealAnimation(myCards, oppCount, topCard) {
    isAnimating = true;
    myHand = [];
    opponentHand = [];
    discardPile = [];

    let dealSpeed = 150; 
    let totalCards = myCards.length + oppCount;
    let dealt = 0;

    let dealInterval = setInterval(() => {
        if (dealt >= totalCards) {
            clearInterval(dealInterval);
            setTimeout(() => {
                topCard.x = 60; topCard.y = height/2;
                discardPile.push(topCard);
                playSound('play');
                isAnimating = false;
                
                setTimeout(() => {
                    showFloatingText(turn === 'me' ? "YOUR TURN" : "OPPONENT'S TURN", width/2, height/2 + 100, turn==='me'?"#0f0":"#fff");
                }, 500);

            }, 300);
            return;
        }

        if (dealt % 2 === 0) {
            let c = new Card('fire', 1);
            c.x = 60; c.y = height/2;
            opponentHand.push(c);
        } else {
            let cardIndex = Math.floor(dealt / 2);
            if (myCards[cardIndex]) {
                let c = myCards[cardIndex];
                c.x = 60; c.y = height/2;
                myHand.push(c);
            }
        }
        playSound('deal');
        dealt++;
    }, dealSpeed);
}

// --- MOVE EXECUTION ---

function isValidMove(card, topCard) {
    // Moon card always valid
    if (card.suit === 'moon') return true;
    // Eclipse Mode Strict Check (Blind Guess)
    if (eclipseMode) {
        // Harus match suit atau value sama persis dengan kartu FOLLOW UP yang tertutup
        return card.suit === topCard.suit || card.value === topCard.value;
    }
    return card.suit === topCard.suit || card.value === topCard.value || topCard.suit === 'moon';
}

function playerInput(cardIndex) {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating) return;
    
    let card = myHand[cardIndex];
    let top = discardPile[discardPile.length - 1];

    // LOGIC KHUSUS MOON CARD
    if (card.suit === 'moon') {
        isChoosingFollowUp = true;
        moonCardRef = myHand.splice(cardIndex, 1)[0]; // Ambil Moon Card
        moonCardRef.targetX = width/2; 
        moonCardRef.targetY = height/2 - 100; // Mengambang di atas
        playSound('moon');
        showFloatingText("SELECT ELEMENT", width/2, height/2 + 50, "#D800FF");
        
        // Spawn particles gelap di sisi saya
        for(let i=0; i<30; i++) particles.push(new Particle(width/2, height/2, '#000', true));
        return;
    }

    // LOGIC SETELAH MOON (FOLLOW UP)
    if (isChoosingFollowUp) {
        // Harus kartu basic
        if (card.suit === 'moon') return; // Gak boleh Moon di atas Moon

        myHand.splice(cardIndex, 1);
        
        // Kirim Paket Combo ke Lawan
        conn.send({
            type: 'OPPONENT_MOON_COMBO',
            moonCard: {suit: 'moon', value: 99},
            followUpCard: {suit: card.suit, value: card.value}
        });

        // Animasi Lokal
        discardPile.push(moonCardRef); // Masukkan moon ke pile
        discardPile.push(card);        // Masukkan kartu elemen ke pile
        
        moonCardRef.targetX = width/2; moonCardRef.targetY = height/2;
        card.targetX = width/2; card.targetY = height/2;
        
        playSound('play');
        isChoosingFollowUp = false;
        moonCardRef = null;
        
        turn = 'opponent';
        showFloatingText("ECLIPSE CAST!", width/2, height/2, "#9D00FF");
        return;
    }

    // LOGIC BIASA
    if (isValidMove(card, top)) {
        myHand.splice(cardIndex, 1);
        discardPile.push(card);
        card.targetX = width/2; card.targetY = height/2;
        playSound('play');

        let isCrit = COUNTER_MAP[card.suit] === top.suit;
        
        if(isCrit) {
            playSound('crit');
            showFloatingText("CRITICAL! (+2)", width/2, height/2 - 50, COLORS[card.suit]);
            if(isHost) {
                for(let i=0; i<2; i++) {
                    let penalty = drawCardFromDeckLogic(); 
                    if(penalty) {
                        setTimeout(() => {
                            conn.send({ type: 'EXTRA_CARD', card: {suit:penalty.suit, value:penalty.value} });
                            opponentHand.push(new Card('fire',1)); 
                        }, i * 200); 
                    }
                }
            }
        }

        conn.send({
            type: 'OPPONENT_MOVE',
            card: { suit: card.suit, value: card.value },
            isCrit: isCrit
        });

        if(myHand.length === 0) {
            endGame("YOU WIN!", "Victory Achieved");
            return;
        }

        turn = 'opponent';
    } else {
        card.targetY -= 30; setTimeout(() => card.targetY += 30, 100);
        showFloatingText("Invalid Move", card.x, card.y - 50, "red");
    }
}

// Proses Lawan main Combo Moon
function processOpponentMoonCombo(moonData, followUpData) {
    let mCard = new Card(moonData.suit, moonData.value);
    let fCard = new Card(followUpData.suit, followUpData.value);

    // Hapus visual kartu dari tangan lawan (2 kartu)
    if(opponentHand.length > 0) opponentHand.pop();
    if(opponentHand.length > 0) opponentHand.pop();

    // Animasi Moon
    mCard.x = width/2; mCard.y = -100;
    mCard.targetX = width/2; mCard.targetY = height/2;
    discardPile.push(mCard);
    playSound('moon');

    // Animasi Follow Up
    setTimeout(() => {
        fCard.x = width/2; fCard.y = -100;
        fCard.targetX = width/2; fCard.targetY = height/2;
        discardPile.push(fCard);
        playSound('play');

        // TRIGGER ECLIPSE
        activateEclipse();
    }, 500);

    turn = 'me';
}

function processOpponentMove(cardData, isCrit) {
    // Jika saya sedang dalam Eclipse Mode, cek apakah kartu lawan VALID
    // (Meskipun logic validasi ada di pengirim, kita double check untuk sinkronisasi eclipse)
    
    let card = new Card(cardData.suit, cardData.value);
    if(opponentHand.length > 0) opponentHand.pop(); 
    
    card.x = width/2; card.y = -100;
    card.targetX = width/2; card.targetY = height/2;
    
    discardPile.push(card);
    playSound('play');

    if(isCrit) {
        playSound('crit');
        showFloatingText("CRITICAL HIT!", width/2, height/2 - 50, COLORS[cardData.suit]);
        if(isHost) {
            for(let i=0; i<2; i++) {
                let penalty = drawCardFromDeckLogic();
                if(penalty) {
                    setTimeout(() => {
                        penalty.x = 60; penalty.y = height/2; 
                        myHand.push(penalty);
                        playSound('deal');
                        showFloatingText("+1 Card", width/2, height/2+50, "red");
                        conn.send({ type: 'PENALTY_SYNC' });
                    }, i * 200);
                }
            }
        }
    }

    setTimeout(() => {
        if(opponentHand.length === 0) {
            endGame("YOU LOSE", "Opponent cleared their hand");
        }
    }, 500);

    turn = 'me';
}

// --- ECLIPSE MECHANIC ---
function activateEclipse() {
    eclipseMode = true;
    showFloatingText("TOTAL ECLIPSE!", width/2, height/2, "#FFF");
    // Partikel menyebar
    for(let i=0; i<100; i++) {
        let p = new Particle(width/2, height/2, '#000', true);
        p.vx *= 3; p.vy *= 3;
        particles.push(p);
    }
}

function deactivateEclipse() {
    eclipseMode = false;
}

function requestDraw() {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating) return;

    // RULE: Cannot draw during Eclipse
    if (eclipseMode) {
        showFloatingText("BLOCKED BY ECLIPSE!", 60, height/2, "red");
        return;
    }

    let newCard;
    if(isHost) {
        newCard = drawCardFromDeckLogic();
    } else {
        let s = SUITS[Math.floor(Math.random()*3)]; // Client draw basic logic wrapper
        let v = Math.floor(Math.random()*9)+1;
        newCard = new Card(s, v);
    }

    if(newCard) {
        newCard.x = 60; newCard.y = height/2;
        myHand.push(newCard);
        playSound('deal');
        
        conn.send({ type: 'OPPONENT_DRAW' });
        turn = 'opponent'; 
        showFloatingText("Turn Ended", width/2, height/2, "#aaa");
    }
}

function drawCardFromDeckLogic() {
    let roll = Math.random();
    // Kecil kemungkinan draw Moon (5%)
    if(roll < 0.05) return new Card('moon', 99);
    
    let s = SUITS[Math.floor(Math.random()*3)];
    let v = Math.floor(Math.random()*9)+1;
    return new Card(s, v);
}

function endGame(title, subtitle) {
    gameState = 'GAMEOVER';
    document.getElementById('winner-text').innerText = title;
    document.getElementById('sub-winner-text').innerText = subtitle;
    document.getElementById('game-over').style.display = 'block';
    setTimeout(()=> { if(peer) peer.destroy(); }, 2000);
}


// --- RENDER LOOP ---

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    let cardW = width < 600 ? 65 : 100;
    let cardH = cardW * 1.4;

    // 1. Draw Board Elements (Under Eclipse)
    
    // Deck
    let deckX = 60; let deckY = height / 2;
    for(let i=0; i<3; i++) {
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#333';
        roundRect(ctx, deckX - cardW/2, (deckY - cardH/2) - i*2, cardW, cardH, 10);
        ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = COLORS.cardBack; ctx.strokeStyle = COLORS.cardBackOutline; ctx.lineWidth = 2;
    roundRect(ctx, deckX - cardW/2, (deckY - cardH/2) - 6, cardW, cardH, 10);
    ctx.fill(); ctx.stroke();
    
    // Discard Pile
    if (discardPile.length > 0) {
        let startIdx = Math.max(0, discardPile.length - 3);
        for(let i = startIdx; i < discardPile.length; i++) {
            let c = discardPile[i];
            // Fix posisi jika bukan moon combo animation
            if(!isAnimating && c !== moonCardRef && Math.abs(c.x - width/2) < 2) c.x = width/2;
            if(!isAnimating && c !== moonCardRef && Math.abs(c.y - height/2) < 2) c.y = height/2;
            c.draw(ctx, true, undefined, undefined, cardW, cardH);
        }
    } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
        roundRect(ctx, width/2 - cardW/2, height/2 - cardH/2, cardW, cardH, 10); ctx.stroke();
    }

    // Moon Card Floating (Choice Mode)
    if (moonCardRef) {
        moonCardRef.draw(ctx, true, undefined, undefined, cardW, cardH);
    }

    // Opponent Hand
    let oppSpread = Math.min(width / (opponentHand.length + 2), cardW * 0.7);
    let oppStart = width/2 - ((opponentHand.length - 1) * oppSpread) / 2;
    opponentHand.forEach((c, i) => {
        c.targetX = oppStart + i * oppSpread;
        c.targetY = -cardH * 0.4;
        c.draw(ctx, false, undefined, undefined, cardW, cardH);
    });

    particles.forEach(p => p.draw(ctx));

    // --- 2. ECLIPSE LAYER ---
    // Transisi halus Alpha
    if (eclipseMode) {
        if(eclipseAlpha < 1) eclipseAlpha += 0.05;
    } else {
        if(eclipseAlpha > 0) eclipseAlpha -= 0.05;
    }

    if (eclipseAlpha > 0.01) {
        ctx.fillStyle = `rgba(0, 0, 0, ${eclipseAlpha})`;
        ctx.fillRect(0, 0, width, height);
        
        // Teks petunjuk saat gelap
        if(eclipseMode) {
            ctx.fillStyle = `rgba(255, 255, 255, ${eclipseAlpha})`;
            ctx.font = "bold 20px Orbitron";
            ctx.textAlign = "center";
            ctx.fillText("ONE SHOT CHANCE", width/2, height/2 - 100);
            ctx.font = "14px Orbitron";
            ctx.fillStyle = "#aaa";
            ctx.fillText("Guess the element blindly or skip turn!", width/2, height/2 - 70);
        }
    }

    // --- 3. MY HAND (ALWAYS VISIBLE - HIGH Z-INDEX) ---
    // Di Moon Mode, tangan sedikit naik
    let handYOffset = eclipseMode ? -100 : 0;
    
    let pSpread = Math.min(width / (myHand.length + 1), cardW + 10);
    let pStart = width/2 - ((myHand.length - 1) * pSpread) / 2;
    myHand.forEach((c, i) => {
        c.targetX = pStart + i * pSpread;
        c.targetY = (height - (c.isHovered ? cardH * 0.9 : cardH * 0.7)) + handYOffset;
        c.width = cardW; c.height = cardH;
        c.draw(ctx, true);
    });

    floatingTexts.forEach(t => t.draw(ctx));

    // Turn Indicator (Render on top if needed, or below overlay depending on UX. Here below overlay but visible if alpha < 1)
    if(gameState === 'PLAYING' && !isAnimating && !eclipseMode) {
        ctx.font = "bold 16px Orbitron"; 
        ctx.fillStyle = turn === 'me' ? '#00FF00' : '#888';
        ctx.textAlign = 'center';
        let txt = turn === 'me' ? "YOUR TURN" : "OPPONENT'S TURN";
        ctx.fillText(txt, width/2, height/2 + cardH/2 + 40);
    }
}

function update() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].update();
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// --- INPUTS ---
function handleInput(x, y) {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating) return;

    // Check Hand Click
    for (let i = myHand.length - 1; i >= 0; i--) {
        let c = myHand[i];
        if (x > c.x - c.width/2 && x < c.x + c.width/2 && 
            y > c.y - c.height/2 && y < c.y + c.height/2) {
            
            // ONE-SHOT CHANCE LOGIC
            if (eclipseMode) {
                let card = myHand[i];
                let top = discardPile[discardPile.length - 1]; // Hidden in dark
                
                // Animasi kartu dilempar
                myHand.splice(i, 1);
                card.targetX = width/2; card.targetY = height/2;
                
                // Cek validitas
                if (isValidMove(card, top)) {
                    // Berhasil menebak!
                    discardPile.push(card);
                    playSound('play');
                    deactivateEclipse();
                    conn.send({
                        type: 'OPPONENT_MOVE',
                        card: {suit: card.suit, value: card.value},
                        isCrit: false // No crit in blind mode for fairness
                    });
                    turn = 'opponent';
                } else {
                    // Gagal menebak!
                    playSound('crit'); // Error sound
                    card.targetY = height + 100; // Jatuh ke bawah
                    showFloatingText("MISSED!", width/2, height/2, "red");
                    
                    // Kembalikan kartu (bouncing back effect visual only, logic says turn skip)
                    // Aturan: Kartu memantul KEMBALI ke tangan
                    setTimeout(() => {
                         card.x = width/2; card.y = height/2;
                         myHand.push(card);
                    }, 500);

                    // Skip Turn
                    conn.send({ type: 'SKIP_TURN_FAIL' });
                    turn = 'opponent'; // Turn balik ke lawan (pemilik moon)
                }
                return;
            }

            playerInput(i); 
            return;
        }
    }

    // Check Deck Click
    let deckX = 60; let deckY = height/2;
    let w = width < 600 ? 65 : 100; let h = w*1.4;
    if (x > deckX - w/2 - 20 && x < deckX + w/2 + 20 &&
        y > deckY - h/2 - 20 && y < deckY + h/2 + 20) {
        requestDraw();
    }
}

function handleHover(x, y) {
    let hovered = false;
    for (let i = myHand.length - 1; i >= 0; i--) {
        let c = myHand[i];
        if (!hovered && x > c.x - c.width/2 && x < c.x + c.width/2 && 
            y > c.y - c.height/2 && y < c.y + c.height/2) {
            c.isHovered = true; hovered = true;
        } else c.isHovered = false;
    }
}

// --- UTILS ---
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.closePath(); }
function showFloatingText(txt, x, y, c) { 
    floatingTexts.push({ text: txt, x: x, y: y, color: c, life: 1, update: function(){this.y-=1.5; this.life-=0.02;}, draw: function(ctx){
        ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.color; ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.font="bold 24px Orbitron"; ctx.strokeText(this.text,this.x,this.y); ctx.fillText(this.text,this.x,this.y); ctx.globalAlpha=1;
    }});
}
function drawElementIcon(ctx, type, x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.beginPath();
    if (type === 'fire') {
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(s, -s/4, 0, s); ctx.quadraticCurveTo(-s, -s/4, 0, -s);
    } else if (type === 'water') {
        ctx.arc(0, 0, s*0.8, 0, Math.PI*2);
    } else if (type === 'leaf') {
        ctx.moveTo(0, -s); ctx.bezierCurveTo(s, -s/2, s, s/2, 0, s); ctx.bezierCurveTo(-s, s/2, -s, -s/2, 0, -s);
    } else if (type === 'moon') {
        ctx.arc(0, 0, s*0.8, 1.5, 5.5); // Crescent Shape simple
        ctx.lineTo(-s*0.3, -s*0.5);
    }
    ctx.fill(); ctx.restore();
}

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleHover(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

resize();
loop();
</script>
