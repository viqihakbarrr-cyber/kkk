<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Co-op Rhythm 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: white; user-select: none; }
        
        /* UI LAYOUTS */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .screen { pointer-events: auto; text-align: center; background: rgba(0,0,0,0.85); padding: 40px; border: 2px solid #00ffff; box-shadow: 0 0 20px #00ffff; border-radius: 10px; display: none; max-width: 90%; }
        .active { display: block; }

        h1 { color: #00ffff; text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 0 10px #00ffff; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; }
        
        button { background: transparent; color: #fff; border: 2px solid #fff; padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; transition: 0.2s; font-family: inherit; font-weight: bold; }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
        
        input[type="text"] { background: transparent; border: 2px solid #fff; color: #fff; padding: 10px; font-size: 24px; text-align: center; width: 150px; margin-bottom: 20px; font-family: inherit; }
        input[type="file"] { margin: 20px 0; }

        /* GAME HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #score-board { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; }
        #waiting-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #aaa; }
        
        /* FEEDBACK EFFECT */
        .feedback { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; opacity: 0; transition: opacity 0.2s; text-shadow: 0 0 20px currentColor; }
        .anim-pop { animation: popUp 0.5s forwards; }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        #fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 100; font-size: 12px; padding: 5px 10px; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="fullscreen-btn">FULLSCREEN</button>

    <div id="ui-layer">
        <div id="screen-start" class="screen active">
            <h1>Neon Rhythm Co-op</h1>
            <p>Mainkan bersama teman (Local WiFi/Internet)</p>
            <button onclick="showCreate()">CREATE ROOM (P1)</button>
            <button onclick="showJoin()">JOIN ROOM (P2)</button>
        </div>

        <div id="screen-create" class="screen">
            <h1>Room Created</h1>
            <p>Kode Room:</p>
            <h2 id="room-code-display" style="font-size: 40px; color: #ff00ff;">...</h2>
            <p>Bagikan kode ini ke Player 2</p>
            <hr style="border-color: #333; margin: 20px 0;">
            <p>Unggah Lagu MP3:</p>
            <input type="file" id="audioFile" accept="audio/*">
            <br>
            <div id="p1-status">Menunggu Player 2...</div>
            <button id="btn-start-game" style="display:none;" onclick="startGameP1()">START GAME</button>
        </div>

        <div id="screen-join" class="screen">
            <h1>Join Room</h1>
            <p>Masukkan 4-Digit Kode:</p>
            <input type="text" id="join-code-input" maxlength="4" placeholder="ABCD">
            <br>
            <button onclick="joinRoom()">JOIN</button>
            <div id="p2-status"></div>
        </div>
    </div>

    <div id="hud">
        <div id="score-board">SKOR: <span id="score-val">0</span></div>
        <div id="feedback-text" class="feedback" style="color: #00ffff;">PERFECT</div>
        <div id="waiting-msg" style="display:none;">Menunggu Host Memulai...</div>
    </div>

    <audio id="music-player" style="display:none;"></audio>

    <script>
        /* --- GLOBAL VARIABLES --- */
        let role = ''; // 'host' or 'client'
        let peer, conn;
        let myId, otherId;
        
        // Game State
        let isPlaying = false;
        let score = 0;
        let audioCtx, analyser, dataArray;
        let audioSource;
        
        // Three.js Vars
        let scene, camera, renderer;
        let ring, grid;
        let balls = [];
        const ballSpeed = 0.5; // Kecepatan bola
        const spawnZ = -80; // Jarak spawn
        
        // Inputs
        let mouseX = 0, mouseY = 0; // Normalized -1 to 1
        let p2Y = 0; // Data Y dari P2
        let p1X = 0; // Data X dari P1 (untuk dikirim ke P2 jika perlu visual sync)

        /* --- FULLSCREEN & SETUP --- */
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        });

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        /* --- PEERJS CONNECTION LOGIC --- */
        function initPeer(customId = null) {
            // Menggunakan PeerJS cloud server default (gratis, kadang ada limit)
            peer = new Peer(customId);
            
            peer.on('open', (id) => {
                myId = id;
                console.log('My ID:', id);
                if(role === 'host') {
                    // Tampilkan hanya 4 karakter terakhir sebagai "Kode" agar simpel
                    let shortCode = id.substring(0, 4).toUpperCase(); 
                    // Agar mudah, kita paksa ID menjadi random 4 huruf jika memungkinkan, 
                    // tapi karena ID harus unik global, kita pakai ID asli peerjs dan user ketik full atau kita mapping.
                    // TRICK: Kita buat ID sendiri yang random 4 huruf.
                }
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnectionHandlers();
                if(role === 'host') {
                    document.getElementById('p1-status').innerText = "Player 2 Terhubung!";
                    checkReadyP1();
                }
            });
            
            peer.on('error', (err) => {
                console.error(err);
                alert("Koneksi Error (Coba refresh atau nama ID sudah dipakai).");
            });
        }

        function setupConnectionHandlers() {
            conn.on('data', (data) => {
                // Handling Data
                if (role === 'host') {
                    if (data.type === 'input') {
                        p2Y = data.y; // Host menerima input Y dari Client
                    }
                } else if (role === 'client') {
                    if (data.type === 'start') {
                        startGameClient();
                    }
                    if (data.type === 'sync') {
                        // Client menerima posisi bola dan skor dari Host untuk visualisasi
                        syncGameData(data); 
                    }
                    if (data.type === 'feedback') {
                        showFeedback(data.text, data.color);
                    }
                }
            });
            conn.on('open', () => {
                if(role === 'client') {
                     document.getElementById('p2-status').innerText = "Terhubung ke P1! Menunggu Game...";
                     document.getElementById('hud').style.display = 'block';
                     document.getElementById('waiting-msg').style.display = 'block';
                     switchScreen('none'); // Hide UI
                }
            });
        }

        /* --- LOBBY LOGIC --- */
        function showCreate() {
            role = 'host';
            // Generate 4 digit random ID
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('room-code-display').innerText = code;
            switchScreen('screen-create');
            initPeer("game_" + code); // ID unik di server peerjs
        }

        function showJoin() {
            role = 'client';
            switchScreen('screen-join');
            // Client ID acak
            initPeer(); 
        }

        function joinRoom() {
            const code = document.getElementById('join-code-input').value.toUpperCase();
            if(code.length < 4) return alert("Masukkan kode 4 digit");
            
            const targetId = "game_" + code;
            conn = peer.connect(targetId);
            setupConnectionHandlers();
            document.getElementById('p2-status').innerText = "Menghubungkan...";
        }

        // P1 Upload Audio
        const fileInput = document.getElementById('audioFile');
        let audioBuffer = null;
        
        fileInput.onchange = function() {
            const file = this.files[0];
            if(file) {
                checkReadyP1();
            }
        };

        function checkReadyP1() {
            if(conn && fileInput.files.length > 0) {
                document.getElementById('btn-start-game').style.display = 'inline-block';
            }
        }

        /* --- GAMEPLAY & THREE.JS --- */
        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            camera.position.y = 2;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Grid Floor
            grid = new THREE.GridHelper(100, 40, 0xff00ff, 0x222222);
            grid.position.y = -2;
            scene.add(grid);

            // The Player Ring (Torus)
            const geometry = new THREE.TorusGeometry(1, 0.05, 16, 100);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            ring = new THREE.Mesh(geometry, material);
            scene.add(ring);

            // Lights
            const light = new THREE.AmbientLight(0x404040); 
            scene.add(light);
            const pointLight = new THREE.PointLight(0x0000ff, 1, 100);
            pointLight.position.set(0, 0, 5);
            scene.add(pointLight);

            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Input Handler (Mouse/Touch)
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onTouch, {passive: false});
        }

        function onMove(e) {
            // Normalize -1 to 1
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            updateRingPos();
        }
        
        function onTouch(e) {
            e.preventDefault();
            let touch = e.touches[0];
            mouseX = (touch.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(touch.clientY / window.innerHeight) * 2 + 1;
            updateRingPos();
        }

        function updateRingPos() {
            // Batas pergerakan
            const limitX = 4; 
            const limitY = 2.5;

            if (role === 'host') {
                // Host control X
                p1X = mouseX * limitX;
                ring.position.x = p1X;
                ring.position.y = p2Y * limitY; // Y controlled by P2 data
            } else {
                // Client control Y
                // Send Y to host
                if(conn && conn.open) {
                    conn.send({ type: 'input', y: mouseY });
                }
                // Client visual local (prediksi agar smooth)
                // Sebenarnya posisi asli ring ditentukan oleh data sync dari Host, 
                // tapi kita update lokal juga biar responsif di layar sendiri
                ring.position.y = mouseY * limitY;
            }
        }

        /* --- GAME LOGIC (HOST ONLY) --- */
        async function startGameP1() {
            switchScreen('none');
            document.getElementById('hud').style.display = 'block';
            
            initThreeJS();
            
            // Audio Context Setup
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            // Start P2
            conn.send({ type: 'start' });

            // Setup Playback & Analyzer
            playMusic(audioBuffer);
            
            isPlaying = true;
            loop();
        }

        function startGameClient() {
            document.getElementById('waiting-msg').style.display = 'none';
            initThreeJS();
            // Client loop hanya render, logic di Host
            loopClient();
        }

        function playMusic(buffer) {
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = buffer;
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            audioSource.connect(analyser);
            analyser.connect(audioCtx.destination);
            audioSource.start(0);
        }

        // SPAWNING BALLS (BEAT DETECTION SIMPLE)
        let lastSpawn = 0;
        function detectBeat() {
            if(!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            
            // Hitung rata-rata volume frekuensi rendah (bass/kick)
            let sum = 0;
            for(let i=0; i<10; i++) sum += dataArray[i];
            let avg = sum / 10;

            // Threshold beat
            if (avg > 230 && Date.now() - lastSpawn > 400) { // 400ms cooldown
                spawnBall();
                lastSpawn = Date.now();
            }
        }

        function spawnBall() {
            // Bola 3D
            const geo = new THREE.SphereGeometry(0.5, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ color: 0x0055ff }); // Biru seperti contoh
            const ball = new THREE.Mesh(geo, mat);
            
            // Posisi Random X Y
            ball.position.z = spawnZ;
            ball.position.x = (Math.random() - 0.5) * 6; // Range X
            ball.position.y = (Math.random() - 0.5) * 4; // Range Y

            scene.add(ball);
            balls.push(ball);
        }

        /* --- LOOPS --- */
        function loop() {
            if(!isPlaying) return;
            requestAnimationFrame(loop);

            detectBeat(); // Host only

            // Move Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.position.z += ballSpeed;

                // Check Hit
                if (b.position.z > 0) {
                    // Logic Hitbox sederhana
                    // Bola harus dekat dengan ring secara X dan Y saat Z ~ 0
                    let dx = Math.abs(b.position.x - ring.position.x);
                    let dy = Math.abs(b.position.y - ring.position.y);
                    
                    if (dx < 1.2 && dy < 1.2) {
                        // HIT!
                        score += 10;
                        updateScore(score);
                        triggerFeedback("PERFECT", "#d900ff"); // Ungu
                        scene.remove(b);
                        balls.splice(i, 1);
                    } else if (b.position.z > 2) {
                        // MISS (lewat kamera)
                        scene.remove(b);
                        balls.splice(i, 1);
                        triggerFeedback("MISS", "#ff0000");
                    }
                }
            }
            
            // Render
            renderer.render(scene, camera);

            // Sync Data to Client
            if(conn && conn.open) {
                // Mengirim posisi ring X, score, dan data bola (agar client bisa render bola)
                // Untuk optimasi, kita kirim array posisi bola sederhana
                let ballData = balls.map(b => ({x: b.position.x, y: b.position.y, z: b.position.z}));
                conn.send({
                    type: 'sync',
                    score: score,
                    ringX: ring.position.x, // Client butuh X host
                    balls: ballData
                });
            }
        }

        function loopClient() {
            requestAnimationFrame(loopClient);
            renderer.render(scene, camera);
        }

        /* --- SYNC FUNCTIONS --- */
        function syncGameData(data) {
            document.getElementById('score-val').innerText = data.score;
            
            // Sync Ring X (P1 Control)
            ring.position.x = data.ringX;
            // Ring Y is controlled locally by client mouse, but to be sure visual is same:
            // ring.position.y = mouseY * limit; (handled in updateRingPos)

            // Sync Balls
            // Hapus bola lama
            balls.forEach(b => scene.remove(b));
            balls = [];
            
            // Buat bola baru sesuai data host (Agak berat, tapi akurat untuk visual)
            data.balls.forEach(bData => {
                const geo = new THREE.SphereGeometry(0.5, 16, 16); // Lower poly for client optimization
                const mat = new THREE.MeshBasicMaterial({ color: 0x0055ff });
                const b = new THREE.Mesh(geo, mat);
                b.position.set(bData.x, bData.y, bData.z);
                scene.add(b);
                balls.push(b);
            });
        }

        function updateScore(val) {
            document.getElementById('score-val').innerText = val;
        }

        function triggerFeedback(text, color) {
            const el = document.getElementById('feedback-text');
            el.innerText = text;
            el.style.color = color;
            el.classList.remove('anim-pop');
            void el.offsetWidth; // trigger reflow
            el.classList.add('anim-pop');

            if(conn && conn.open) {
                conn.send({ type: 'feedback', text: text, color: color });
            }
        }

        function showFeedback(text, color) {
            const el = document.getElementById('feedback-text');
            el.innerText = text;
            el.style.color = color;
            el.classList.remove('anim-pop');
            void el.offsetWidth;
            el.classList.add('anim-pop');
        }

    </script>
</body>
</html>
