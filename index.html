<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELUNO: MOON ECLIPSE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        /* UI Layers */
        #ui-layer, #start-screen, #lobby-screen, #loading-layer, #moon-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: none;
        }

        /* Interactive Layers */
        #start-screen, #lobby-screen, #game-over {
            pointer-events: auto;
        }

        #start-screen, #lobby-screen {
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        /* Loading Layer */
        #loading-layer {
            background: rgba(0,0,0,0.8);
            z-index: 300;
            display: none;
        }

        /* MOON ECLIPSE UI TEXT ONLY (Visual darkening is now in Canvas) */
        #moon-overlay {
            z-index: 50; 
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            justify-content: flex-start;
            padding-top: 100px;
        }
        
        #moon-overlay.active {
            opacity: 1;
        }

        #moon-msg {
            color: #b19cd9;
            font-size: 24px;
            text-shadow: 0 0 10px #b19cd9;
            margin-top: 20%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00CC44;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: white; margin-top: 20px; font-size: 16px; letter-spacing: 2px; }

        .modal-box {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            border: 4px solid #333;
            max-width: 90%;
            width: 400px;
        }

        h1 { margin: 0 0 20px 0; color: #000; font-size: 28px; letter-spacing: 2px; }
        h2 { margin: 0 0 15px 0; color: #333; font-size: 18px; }
        
        .checkbox-container {
            margin: 20px 0;
            font-size: 16px;
            color: #333;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
            accent-color: #000;
        }

        /* Inputs & Buttons */
        .input-group { margin-bottom: 20px; }
        input[type="number"] {
            padding: 10px; font-family: 'Orbitron'; font-size: 24px; text-align: center;
            border: 2px solid #333; border-radius: 10px; width: 150px; outline: none;
        }
        input[type="number"]:focus { border-color: #0088FF; }

        .room-code-display {
            font-size: 36px; font-weight: bold; color: #0088FF; margin: 20px 0;
            letter-spacing: 5px;
        }

        button.main-btn {
            padding: 15px 30px;
            background: #000;
            border: none; color: white;
            font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.2s;
            margin: 10px;
            min-width: 150px;
        }

        button.main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        button.main-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,136,255,0.5); }
        button.main-btn.active { background: linear-gradient(45deg, #0088FF, #00CC44); }

        .btn-secondary { background: #555 !important; }

        /* Game Over Screen */
        #game-over {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 20px;
            text-align: center; border: 3px solid #333;
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 500;
        }

        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div id="moon-overlay">
        <div id="moon-msg">DARKNESS FALLS<br><span style="font-size:14px; color:#fff">Match the hidden element!</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="loading-layer">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-msg">CONNECTING...</div>
    </div>

    <div id="start-screen">
        <div class="modal-box">
            <h1>ELUNO</h1>
            <p style="color:#666; font-size:14px;">MOON ECLIPSE EDITION</p>
            
            <label class="checkbox-container">
                <input type="checkbox" id="fs-check" onchange="checkFullscreenRequirement()">
                Enable Fullscreen
            </label>

            <button id="start-btn" class="main-btn" disabled onclick="goToLobby()">ENTER LOBBY</button>
        </div>
    </div>

    <div id="lobby-screen" class="hidden">
        <div class="modal-box" id="lobby-main">
            <h1>MULTIPLAYER</h1>
            <button class="main-btn active" onclick="createRoom()">CREATE ROOM</button>
            <br>
            <button class="main-btn btn-secondary" onclick="showJoinUI()">JOIN ROOM</button>
        </div>

        <div class="modal-box hidden" id="lobby-wait">
            <h2>ROOM CODE</h2>
            <div class="room-code-display" id="host-room-code">----</div>
            <p>Waiting for opponent...</p>
            <div class="spinner" style="width:30px; height:30px; margin: 0 auto;"></div>
            <br>
            <button class="main-btn btn-secondary" onclick="resetLobby()">CANCEL</button>
        </div>

        <div class="modal-box hidden" id="lobby-join">
            <h2>ENTER CODE</h2>
            <div class="input-group">
                <input type="number" id="join-code-input" placeholder="0000" maxlength="4">
            </div>
            <button class="main-btn active" onclick="joinRoom()">JOIN</button>
            <br>
            <button class="main-btn btn-secondary" onclick="resetLobby()">BACK</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="game-over">
            <h1 id="winner-text">YOU WIN!</h1>
            <p id="sub-winner-text" style="color:#666; margin-bottom:20px;">Opponent Disconnected</p>
            <button class="main-btn active" onclick="location.reload()">MAIN MENU</button>
        </div>
    </div>

<script>
// --- KONFIGURASI PEERJS & NETWORK ---
let peer = null;
let conn = null;
let myPeerID = null;
let isHost = false;
const ID_PREFIX = "eluno-moon-v1-";

// --- KONFIGURASI CANVAS & GAME ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;
let particles = [];
let floatingTexts = [];

// Game Constants
const SUITS = ['fire', 'water', 'leaf', 'moon'];
const COLORS = {
    fire: '#FF2222',
    water: '#0088FF',
    leaf: '#00CC44',
    moon: '#9D8CC2', 
    cardBg: '#FFFFFF',
    cardBack: '#1a1a1a',
    cardBackOutline: '#00FFFF'
};
const COUNTER_MAP = { fire: 'leaf', leaf: 'water', water: 'fire', moon: 'none' };

// Game State
let deck = [];
let discardPile = [];
let myHand = [];
let opponentHand = []; 
let turn = ''; 
let gameState = 'MENU'; 
let isAnimating = false; 

// MOON SPECIAL STATE
let waitingForCombo = false; 
let moonEffectActive = false; 
let moonDarknessAlpha = 0; // Untuk animasi fade-in kegelapan
let hiddenTargetSuit = null; 

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let t = audioCtx.currentTime;
    
    if (type === 'play') {
        osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'deal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t + 0.08);
        osc.start(); osc.stop(t + 0.08);
    } else if (type === 'crit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(600, t + 0.3);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(); osc.stop(t + 0.3);
    } else if (type === 'moon_activate') {
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(100, t); osc.frequency.linearRampToValueAtTime(50, t + 1.5);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t + 1.5);
        osc.start(); osc.stop(t + 1.5);
    } else if (type === 'moon_break') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
        gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'bounce') {
        osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(300, t + 0.1); osc.frequency.linearRampToValueAtTime(200, t + 0.2);
        gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(); osc.stop(t + 0.2);
    }
}

// --- CLASS DEFINITIONS ---
class Card {
    constructor(suit, value) {
        this.suit = suit; this.value = value;
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = 60; this.y = height/2; 
        this.targetX = width / 2; this.targetY = height / 2;
        this.width = 0; this.height = 0;
        this.isHovered = false;
        this.rotation = 0;
    }

    draw(ctx, isFaceUp, x, y, w, h) {
        this.x += (this.targetX - this.x) * 0.15;
        this.y += (this.targetY - this.y) * 0.15;

        const drawX = x !== undefined ? x : this.x;
        const drawY = y !== undefined ? y : this.y;
        const drawW = w || this.width;
        const drawH = h || this.height;
        const r = 10;

        ctx.save();
        ctx.translate(drawX, drawY);

        if (isFaceUp) {
            ctx.fillStyle = COLORS.cardBg;
            ctx.strokeStyle = COLORS[this.suit];
            ctx.lineWidth = this.suit === 'moon' ? 4 : 2; 
            ctx.shadowColor = this.suit === 'moon' ? 'rgba(157, 140, 194, 0.8)' : 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = this.isHovered ? 20 : (this.suit === 'moon' ? 15 : 5);
            ctx.shadowOffsetY = 3;

            roundRect(ctx, -drawW/2, -drawH/2, drawW, drawH, r);
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

            drawElementIcon(ctx, this.suit, 0, 0, drawW * 0.35);

            ctx.fillStyle = COLORS[this.suit];
            ctx.font = `bold ${drawW * 0.25}px Orbitron`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            if (this.suit !== 'moon') {
                ctx.fillText(this.value, drawW/2 - 20, -drawH/2 + 25);
                ctx.fillText(this.value, -drawW/2 + 20, drawH/2 - 25);
            } else {
                ctx.font = `bold ${drawW * 0.15}px Orbitron`;
                ctx.fillText("ECLIPSE", 0, -drawH/2 + 20);
                ctx.fillText("COMBO", 0, drawH/2 - 20);
            }

        } else {
            ctx.fillStyle = COLORS.cardBack;
            ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
            roundRect(ctx, -drawW/2, -drawH/2, drawW, drawH, r);
            ctx.fill(); ctx.stroke();
            ctx.strokeStyle = COLORS.cardBackOutline; ctx.lineWidth = 2;
            ctx.beginPath();
            let pad = 8;
            ctx.roundRect(-drawW/2 + pad, -drawH/2 + pad, drawW - pad*2, drawH - pad*2, r/2);
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(10, 10); ctx.moveTo(10, -10); ctx.lineTo(-10, 10); ctx.stroke();
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 5 + 2;
        this.vx = (Math.random() - 0.5) * 15; // Lebih cepat menyebar
        this.vy = (Math.random() - 0.5) * 15;
        this.life = 1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.02; this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill(); ctx.globalAlpha = 1;
    }
}

// --- FUNGSI LOBBY & NETWORK ---

function showLoading(msg) {
    document.getElementById('loading-layer').style.display = 'flex';
    document.getElementById('loading-msg').innerText = msg;
}
function hideLoading() {
    document.getElementById('loading-layer').style.display = 'none';
}

function checkFullscreenRequirement() {
    const chk = document.getElementById('fs-check');
    const btn = document.getElementById('start-btn');
    if(chk.checked) {
        btn.classList.add('active');
        btn.disabled = false;
    } else {
        btn.classList.remove('active');
        btn.disabled = true;
    }
}

function goToLobby() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen().catch(err => {});
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('lobby-screen').classList.remove('hidden');
}

function createRoom() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    const fullID = ID_PREFIX + code;
    showLoading("CREATING ROOM...");
    peer = new Peer(fullID);
    
    peer.on('open', (id) => {
        hideLoading();
        isHost = true;
        myPeerID = id;
        document.getElementById('lobby-main').classList.add('hidden');
        document.getElementById('lobby-wait').classList.remove('hidden');
        document.getElementById('host-room-code').innerText = code;
    });

    peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        showFloatingText("PLAYER JOINED!", width/2, height/2, "#0f0");
        setTimeout(startMultiplayerGame, 1000);
    });

    peer.on('error', (err) => {
        hideLoading();
        alert("Error creating room: " + err);
        resetLobby();
    });
}

function showJoinUI() {
    document.getElementById('lobby-main').classList.add('hidden');
    document.getElementById('lobby-join').classList.remove('hidden');
}

function joinRoom() {
    const input = document.getElementById('join-code-input').value;
    if (input.length !== 4) { alert("Enter 4 digits code!"); return; }
    showLoading("JOINING ROOM...");
    const targetID = ID_PREFIX + input;
    peer = new Peer(); 
    peer.on('open', () => {
        conn = peer.connect(targetID);
        setupConnection();
    });
    peer.on('error', (err) => {
        hideLoading();
        alert("Room not found!");
        resetLobby();
    });
}

function resetLobby() {
    if(peer) peer.destroy();
    peer = null; conn = null;
    document.getElementById('lobby-main').classList.remove('hidden');
    document.getElementById('lobby-wait').classList.add('hidden');
    document.getElementById('lobby-join').classList.add('hidden');
    hideLoading();
}

function setupConnection() {
    conn.on('open', () => { console.log("Connected"); });
    conn.on('data', (data) => { handleNetworkData(data); });
    conn.on('close', () => { endGame("DISCONNECTED", "Opponent left the game"); });
}

// --- NETWORK DATA HANDLING ---
function handleNetworkData(data) {
    if (data.type === 'START_GAME') {
        document.getElementById('lobby-screen').classList.add('hidden');
        hideLoading();
        gameState = 'PLAYING';
        
        turn = data.turn === 'p2' ? 'me' : 'opponent';

        let myStartCards = data.p2Hand.map(c => new Card(c.suit, c.value));
        let oppStartCount = data.p1HandCount;
        let topCard = new Card(data.topDiscard.suit, data.topDiscard.value);

        playDealAnimation(myStartCards, oppStartCount, topCard);
    
    } else if (data.type === 'OPPONENT_MOVE') {
        processOpponentMove(data.card, data.isCrit);
    
    } else if (data.type === 'OPPONENT_DRAW') {
        let c = new Card('fire', 1);
        c.x = 60; c.y = height/2;
        opponentHand.push(c);
        playSound('deal');
        showFloatingText("Opponent Drew", width/2, 100, "#aaa");
        turn = 'me';
        showFloatingText("YOUR TURN", width/2, height/2 + 100, "#0f0");

    } else if (data.type === 'EXTRA_CARD') {
        let c = data.card;
        let nc = new Card(c.suit, c.value);
        nc.x = 60; nc.y = height/2;
        nc.targetX = width/2; nc.targetY = -200;
        myHand.push(nc);
        playSound('deal');
        showFloatingText("Penalty!", width/2, height/2+50, "red");

    } else if (data.type === 'PENALTY_SYNC') {
        let c = new Card('fire', 1);
        c.x = 60; c.y = height/2;
        opponentHand.push(c);
        playSound('deal');
        showFloatingText("Opponent Penalized!", width/2, 100, "red");

    } else if (data.type === 'MOON_ATTACK') {
        // REVISI: Logika Animasi Moon Attack dari Lawan
        
        // 1. Kartu Moon Bergerak ke Tengah
        let moonCard = new Card('moon', 0);
        moonCard.x = width/2; moonCard.y = -100; // Mulai dari posisi lawan
        moonCard.targetX = width/2; moonCard.targetY = height/2; // Ke Tengah
        
        // 2. Kartu Combo Bergerak ke Tengah (di bawah moon untuk sementara atau menyusul)
        let comboCard = new Card(data.combo.suit, data.combo.value);
        comboCard.x = width/2; comboCard.y = -100;
        
        discardPile.push(moonCard); 
        if(opponentHand.length > 0) opponentHand.pop();

        // 3. Tunggu Moon sampai ke tengah, BARU aktifkan kegelapan
        setTimeout(() => {
            playSound('play');
            // Combo masuk
            comboCard.targetX = width/2; comboCard.targetY = height/2;
            discardPile.push(comboCard);
            if(opponentHand.length > 0) opponentHand.pop();

            // TRIGGER GELAP & PARTIKEL DARI TENGAH (Moon Card Position)
            explodeParticles(width/2, height/2, '#9D8CC2');
            activateMoonEclipse(data.combo.suit);
        }, 600); // Delay agar kartu terlihat bergerak dulu

    } else if (data.type === 'MOON_DEFEND_SUCCESS') {
        let c = new Card(data.card.suit, data.card.value);
        c.x = width/2; c.y = -100;
        c.targetX = width/2; c.targetY = height/2;
        discardPile.push(c);
        if(opponentHand.length > 0) opponentHand.pop();
        
        playSound('moon_break');
        showFloatingText("DEFENDED!", width/2, 100, "#fff");
        turn = 'me'; 
        showFloatingText("YOUR TURN", width/2, height/2 + 100, "#0f0");

    } else if (data.type === 'MOON_DEFEND_FAIL') {
        playSound('bounce');
        showFloatingText("SKIP TURN!", width/2, 100, "#ff00ff");
        turn = 'me';
        showFloatingText("YOUR TURN", width/2, height/2 + 100, "#0f0");
    }
}

// --- GAME LOGIC & ANIMATION ---

function startMultiplayerGame() {
    document.getElementById('lobby-screen').classList.add('hidden');
    gameState = 'PLAYING';

    let realDeck = [];
    ['fire', 'water', 'leaf'].forEach(suit => {
        for (let i = 1; i <= 9; i++) {
            realDeck.push({suit, value: i});
            if(i <= 5) realDeck.push({suit, value: i});
        }
    });
    realDeck.push({suit: 'moon', value: 0});
    realDeck.push({suit: 'moon', value: 0});

    for (let i = realDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [realDeck[i], realDeck[j]] = [realDeck[j], realDeck[i]]; }

    let p1H = realDeck.splice(0, 6); 
    let p2H = realDeck.splice(0, 6); 
    
    let top;
    while(true) {
        top = realDeck.pop();
        if(top.suit !== 'moon') break;
        realDeck.unshift(top);
    }
    
    let myStartCards = p1H.map(c => new Card(c.suit, c.value));
    let topCardObj = new Card(top.suit, top.value);

    turn = Math.random() > 0.5 ? 'me' : 'opponent';

    conn.send({
        type: 'START_GAME',
        deckCount: realDeck.length,
        topDiscard: top,
        p1HandCount: 6,
        p2Hand: p2H, 
        turn: turn === 'me' ? 'p1' : 'p2'
    });

    playDealAnimation(myStartCards, 6, topCardObj);
}

function playDealAnimation(myCards, oppCount, topCard) {
    isAnimating = true;
    myHand = [];
    opponentHand = [];
    discardPile = [];

    let dealSpeed = 150; 
    let totalCards = myCards.length + oppCount;
    let dealt = 0;

    let dealInterval = setInterval(() => {
        if (dealt >= totalCards) {
            clearInterval(dealInterval);
            setTimeout(() => {
                topCard.x = 60; topCard.y = height/2;
                discardPile.push(topCard);
                playSound('play');
                isAnimating = false;
                
                setTimeout(() => {
                    showFloatingText(turn === 'me' ? "YOUR TURN" : "OPPONENT'S TURN", width/2, height/2 + 100, turn==='me'?"#0f0":"#fff");
                }, 500);

            }, 300);
            return;
        }

        if (dealt % 2 === 0) {
            let c = new Card('fire', 1);
            c.x = 60; c.y = height/2;
            opponentHand.push(c);
        } else {
            let cardIndex = Math.floor(dealt / 2);
            if (myCards[cardIndex]) {
                let c = myCards[cardIndex];
                c.x = 60; c.y = height/2;
                myHand.push(c);
            }
        }
        playSound('deal');
        dealt++;
    }, dealSpeed);
}

// --- MOON LOGIC FUNCTIONS ---

function explodeParticles(x, y, color) {
    for(let i=0; i<50; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function activateMoonEclipse(targetSuit) {
    moonEffectActive = true;
    moonDarknessAlpha = 0; // Reset alpha untuk efek fade-in
    hiddenTargetSuit = targetSuit;
    
    const ol = document.getElementById('moon-overlay');
    ol.classList.add('active');
    document.getElementById('moon-msg').style.opacity = 1;
    
    playSound('moon_activate');
    turn = 'me'; 
    showFloatingText("GUESS THE ELEMENT!", width/2, height/2 - 100, "#fff");
}

function deactivateMoonEclipse() {
    moonEffectActive = false;
    hiddenTargetSuit = null;
    const ol = document.getElementById('moon-overlay');
    ol.classList.remove('active');
    document.getElementById('moon-msg').style.opacity = 0;
}

// --- INPUT & MOVE LOGIC ---

function isValidMove(card, topCard) {
    if (card.suit === 'moon') return true; 
    if (topCard.suit === 'moon') return true; 
    return card.suit === topCard.suit || card.value === topCard.value;
}

function playerInput(cardIndex) {
    if (gameState !== 'PLAYING' || isAnimating) return;
    if (turn !== 'me' && !moonEffectActive) return; 

    let card = myHand[cardIndex];

    if (moonEffectActive) {
        if (card.suit === hiddenTargetSuit) {
            myHand.splice(cardIndex, 1);
            discardPile.push(card);
            card.targetX = width/2; card.targetY = height/2;
            playSound('moon_break');
            
            conn.send({ type: 'MOON_DEFEND_SUCCESS', card: {suit: card.suit, value: card.value} });
            deactivateMoonEclipse();
            
            turn = 'opponent';
        } else {
            card.targetY = height - 200; 
            playSound('bounce');
            setTimeout(() => { card.targetY = height - (width < 600 ? 65*0.7 : 100*0.7); }, 300);
            
            showFloatingText("WRONG!", card.x, card.y - 100, "red");
            
            conn.send({ type: 'MOON_DEFEND_FAIL' });
            deactivateMoonEclipse();
            
            turn = 'opponent';
        }
        return;
    }

    if (waitingForCombo) {
        if (['fire', 'water', 'leaf'].includes(card.suit)) {
            let moonIdx = myHand.findIndex(c => c.suit === 'moon');
            if (moonIdx === -1) { waitingForCombo = false; return; }
            
            let moonC = myHand[moonIdx];
            
            if (moonIdx > cardIndex) {
                myHand.splice(moonIdx, 1);
                myHand.splice(cardIndex, 1);
            } else {
                myHand.splice(cardIndex, 1);
                myHand.splice(moonIdx, 1);
            }
            
            discardPile.push(moonC);
            moonC.targetX = width/2; moonC.targetY = height/2;
            
            setTimeout(() => {
                discardPile.push(card);
                card.targetX = width/2; card.targetY = height/2;
                playSound('play');
            }, 200);

            waitingForCombo = false;
            
            conn.send({ 
                type: 'MOON_ATTACK', 
                combo: {suit: card.suit, value: card.value} 
            });
            
            // Player who Casts Moon sees it too
            // Optional: explodeParticles(width/2, height/2, '#9D8CC2'); 
            // But usually we want screen to be clear for the caster
            
            turn = 'opponent'; 
            showFloatingText("ECLIPSE CAST!", width/2, height/2 - 50, "#9D8CC2");
            playSound('moon_activate');
            
            if(myHand.length === 0) endGame("YOU WIN!", "Moon Finisher");

        } else {
             card.targetY -= 30; setTimeout(() => card.targetY += 30, 100);
             showFloatingText("Must be Basic!", card.x, card.y - 50, "red");
        }
        return;
    }

    let top = discardPile[discardPile.length - 1];

    if (card.suit === 'moon') {
        waitingForCombo = true;
        playSound('play');
        showFloatingText("CHAIN ELEMENT!", width/2, height/2, "#fff");
        card.targetY -= 20; 
        return;
    }

    if (isValidMove(card, top)) {
        myHand.splice(cardIndex, 1);
        discardPile.push(card);
        card.targetX = width/2; card.targetY = height/2;
        playSound('play');

        let isCrit = COUNTER_MAP[card.suit] === top.suit;
        
        if(isCrit) {
            playSound('crit');
            showFloatingText("CRITICAL! (+2)", width/2, height/2 - 50, COLORS[card.suit]);
            if(isHost) {
                for(let i=0; i<2; i++) {
                    let penalty = drawCardFromDeckLogic(); 
                    if(penalty) {
                        setTimeout(() => {
                            conn.send({ type: 'EXTRA_CARD', card: {suit:penalty.suit, value:penalty.value} });
                            opponentHand.push(new Card('fire',1));
                        }, i * 200); 
                    }
                }
            }
        }

        conn.send({
            type: 'OPPONENT_MOVE',
            card: { suit: card.suit, value: card.value },
            isCrit: isCrit
        });

        if(myHand.length === 0) {
            endGame("YOU WIN!", "Victory Achieved");
            return;
        }

        turn = 'opponent';
    } else {
        card.targetY -= 30; setTimeout(() => card.targetY += 30, 100);
        showFloatingText("Invalid Move", card.x, card.y - 50, "red");
    }
}

function processOpponentMove(cardData, isCrit) {
    let card = new Card(cardData.suit, cardData.value);
    if(opponentHand.length > 0) opponentHand.pop(); 
    
    card.x = width/2; card.y = -100;
    card.targetX = width/2; card.targetY = height/2;
    
    discardPile.push(card);
    playSound('play');

    if(isCrit) {
        playSound('crit');
        showFloatingText("CRITICAL HIT!", width/2, height/2 - 50, COLORS[cardData.suit]);
        if(isHost) {
            for(let i=0; i<2; i++) {
                let penalty = drawCardFromDeckLogic();
                if(penalty) {
                    setTimeout(() => {
                        penalty.x = 60; penalty.y = height/2; 
                        myHand.push(penalty);
                        playSound('deal');
                        showFloatingText("+1 Card", width/2, height/2+50, "red");
                        conn.send({ type: 'PENALTY_SYNC' });
                    }, i * 200);
                }
            }
        }
    }

    setTimeout(() => {
        if(opponentHand.length === 0) {
            endGame("YOU LOSE", "Opponent cleared their hand");
        }
    }, 500);

    turn = 'me';
}

function requestDraw() {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating || moonEffectActive) return;

    let newCard;
    if(isHost) {
        newCard = drawCardFromDeckLogic();
    } else {
        let r = Math.random();
        let s = r > 0.9 ? 'moon' : SUITS[Math.floor(Math.random()*3)]; 
        let v = s === 'moon' ? 0 : Math.floor(Math.random()*9)+1;
        newCard = new Card(s, v);
    }

    if(newCard) {
        newCard.x = 60; newCard.y = height/2;
        myHand.push(newCard);
        playSound('deal');
        
        conn.send({ type: 'OPPONENT_DRAW' });
        
        turn = 'opponent'; 
        showFloatingText("Turn Ended", width/2, height/2, "#aaa");
    }
}

function drawCardFromDeckLogic() {
    let r = Math.random();
    let s = r > 0.95 ? 'moon' : SUITS[Math.floor(Math.random()*3)];
    let v = s === 'moon' ? 0 : Math.floor(Math.random()*9)+1;
    return new Card(s, v);
}

function endGame(title, subtitle) {
    gameState = 'GAMEOVER';
    document.getElementById('winner-text').innerText = title;
    document.getElementById('sub-winner-text').innerText = subtitle;
    document.getElementById('game-over').style.display = 'block';
    deactivateMoonEclipse();
    setTimeout(()=> { if(peer) peer.destroy(); }, 2000);
}


// --- RENDER LOOP ---

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    let cardW = width < 600 ? 65 : 100;
    let cardH = cardW * 1.4;

    // --- LAYER 1: BACKGROUND STUFF (Deck, Opponent, Discard) ---
    // (Akan tertutup gelap jika Moon Active)
    
    // Deck
    let deckX = 60; let deckY = height / 2;
    for(let i=0; i<3; i++) {
        ctx.fillStyle = '#111'; ctx.strokeStyle = '#333';
        roundRect(ctx, deckX - cardW/2, (deckY - cardH/2) - i*2, cardW, cardH, 10);
        ctx.fill(); ctx.stroke();
    }
    // Deck Top
    ctx.fillStyle = COLORS.cardBack; ctx.strokeStyle = COLORS.cardBackOutline; ctx.lineWidth = 2;
    roundRect(ctx, deckX - cardW/2, (deckY - cardH/2) - 6, cardW, cardH, 10);
    ctx.fill(); ctx.stroke();
    
    // Discard Pile
    if (discardPile.length > 0) {
        let startIdx = Math.max(0, discardPile.length - 3);
        for(let i = startIdx; i < discardPile.length; i++) {
            let c = discardPile[i];
            if(!isAnimating && Math.abs(c.x - width/2) < 2) c.x = width/2;
            if(!isAnimating && Math.abs(c.y - height/2) < 2) c.y = height/2;
            c.draw(ctx, true, undefined, undefined, cardW, cardH);
        }
    }

    // Opponent Hand
    let oppSpread = Math.min(width / (opponentHand.length + 2), cardW * 0.7);
    let oppStart = width/2 - ((opponentHand.length - 1) * oppSpread) / 2;
    opponentHand.forEach((c, i) => {
        c.targetX = oppStart + i * oppSpread;
        c.targetY = -cardH * 0.4;
        c.draw(ctx, false, undefined, undefined, cardW, cardH);
    });
    
    // Particles (Draw here so they can be behind darkness or front, let's keep them here)
    particles.forEach(p => p.draw(ctx));

    // --- LAYER 2: DARKNESS OVERLAY (ECLIPSE) ---
    // Jika moonEffectActive, gambar layar hitam transparan DI ATAS background & deck/discard
    // Tapi DI BAWAH tangan kita.
    if (moonEffectActive) {
        if(moonDarknessAlpha < 0.95) moonDarknessAlpha += 0.05; // Fade In Animation
        ctx.fillStyle = `rgba(0, 0, 0, ${moonDarknessAlpha})`;
        ctx.fillRect(0, 0, width, height);
        
        // Optional: Draw glow in center where moon is
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        let grad = ctx.createRadialGradient(width/2, height/2, 10, width/2, height/2, 300);
        grad.addColorStop(0, 'rgba(157, 140, 194, 0.4)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);
        ctx.restore();
    }

    // --- LAYER 3: MY HAND (RISING LAYER) ---
    // Digambar SETELAH Darkness Overlay agar terlihat "Naik" dan jelas
    let pSpread = Math.min(width / (myHand.length + 1), cardW + 10);
    let pStart = width/2 - ((myHand.length - 1) * pSpread) / 2;
    myHand.forEach((c, i) => {
        c.targetX = pStart + i * pSpread;
        c.targetY = height - (c.isHovered ? cardH * 0.9 : cardH * 0.7);
        c.width = cardW; c.height = cardH;
        
        // Add Glow effect to hand cards during Eclipse to make them pop
        if(moonEffectActive) {
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 30;
        }

        c.draw(ctx, true);
        ctx.shadowBlur = 0; // Reset
    });

    // --- UI & TEXTS ---
    floatingTexts.forEach(t => t.draw(ctx));

    if(gameState === 'PLAYING' && !isAnimating && !moonEffectActive) {
        ctx.font = "bold 16px Orbitron"; 
        ctx.fillStyle = turn === 'me' ? '#00FF00' : '#888';
        ctx.textAlign = 'center';
        let txt = turn === 'me' ? "YOUR TURN" : "OPPONENT'S TURN";
        if(waitingForCombo) txt = "SELECT ELEMENT TO COMBINE!";
        ctx.fillText(txt, width/2, height/2 + cardH/2 + 40);
    }
}

function update() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].update();
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// --- INPUTS ---
function handleInput(x, y) {
    if (gameState !== 'PLAYING' || isAnimating) return;

    // Check Hand First (Interaction always allowed)
    for (let i = myHand.length - 1; i >= 0; i--) {
        let c = myHand[i];
        if (x > c.x - c.width/2 && x < c.x + c.width/2 && 
            y > c.y - c.height/2 && y < c.y + c.height/2) {
            playerInput(i); return;
        }
    }

    // If Moon Active, BLOCK Deck Click
    if (moonEffectActive) return;
    if (turn !== 'me') return;

    let deckX = 60; let deckY = height/2;
    let w = width < 600 ? 65 : 100; let h = w*1.4;
    if (x > deckX - w/2 - 20 && x < deckX + w/2 + 20 &&
        y > deckY - h/2 - 20 && y < deckY + h/2 + 20) {
        requestDraw();
    }
}

function handleHover(x, y) {
    let hovered = false;
    for (let i = myHand.length - 1; i >= 0; i--) {
        let c = myHand[i];
        if (!hovered && x > c.x - c.width/2 && x < c.x + c.width/2 && 
            y > c.y - c.height/2 && y < c.y + c.height/2) {
            c.isHovered = true; hovered = true;
        } else c.isHovered = false;
    }
}

// --- UTILS ---
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.closePath(); }
function showFloatingText(txt, x, y, c) { 
    floatingTexts.push({ text: txt, x: x, y: y, color: c, life: 1, update: function(){this.y-=1.5; this.life-=0.02;}, draw: function(ctx){
        ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.color; ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.font="bold 24px Orbitron"; ctx.strokeText(this.text,this.x,this.y); ctx.fillText(this.text,this.x,this.y); ctx.globalAlpha=1;
    }});
}
function drawElementIcon(ctx, type, x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.beginPath();
    if (type === 'fire') {
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(s, -s/4, 0, s); ctx.quadraticCurveTo(-s, -s/4, 0, -s);
    } else if (type === 'water') {
        ctx.arc(0, 0, s*0.8, 0, Math.PI*2);
    } else if (type === 'leaf') {
        ctx.moveTo(0, -s); ctx.bezierCurveTo(s, -s/2, s, s/2, 0, s); ctx.bezierCurveTo(-s, s/2, -s, -s/2, 0, -s);
    } else if (type === 'moon') {
        ctx.arc(0, 0, s, 0.25 * Math.PI, 1.25 * Math.PI, false);
        ctx.arc(-s * 0.4, -s * 0.4, s * 0.8, 1.25 * Math.PI, 0.25 * Math.PI, true);
    }
    ctx.fill(); ctx.restore();
}

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleHover(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

resize();
loop();
</script>
