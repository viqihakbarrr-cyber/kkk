<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WebCall</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f0f2f5;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .phone-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #333; }

        .status {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 20px;
        }

        .id-container {
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            word-break: break-all;
            cursor: pointer;
            border: 1px dashed #ccc;
            position: relative;
        }

        .id-container:active { background: #dde2e6; }
        
        .id-label { font-size: 0.8em; color: #555; display: block; margin-bottom: 5px; }
        .my-id-text { font-weight: bold; color: var(--primary); font-size: 1.1em; }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--primary); }

        .controls {
            display: grid;
            gap: 10px;
        }

        button {
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
            color: white;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-call { background-color: var(--success); }
        .btn-end { background-color: var(--danger); display: none; }
        
        /* Animasi saat menelpon */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="phone-card">
        <h2>📞 WebCall</h2>
        <div id="status" class="status">Menghubungkan ke server...</div>

        <div class="id-container" onclick="copyId()">
            <span class="id-label">ID Anda (Klik untuk salin):</span>
            <span id="my-id" class="my-id-text">...</span>
        </div>

        <div id="call-input-area">
            <input type="text" id="remote-id" placeholder="Tempel ID Teman disini...">
        </div>

        <div class="controls">
            <button id="btn-call" class="btn-call" onclick="initiateCall()">Panggil</button>
            <button id="btn-end" class="btn-end" onclick="endCall()">Akhiri Panggilan</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        let peer = null;
        let currentCall = null;
        let localStream = null;

        const statusEl = document.getElementById('status');
        const myIdEl = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const btnCall = document.getElementById('btn-call');
        const btnEnd = document.getElementById('btn-end');
        const inputArea = document.getElementById('call-input-area');
        const remoteAudio = document.getElementById('remote-audio');

        // 1. Inisialisasi PeerJS
        function initPeer() {
            // Membuat ID random otomatis
            peer = new Peer(); 

            peer.on('open', (id) => {
                myIdEl.innerText = id;
                statusEl.innerText = "Siap untuk memanggil.";
                console.log('My ID:', id);
            });

            // 2. Menangani Panggilan Masuk
            peer.on('call', (call) => {
                if(confirm("Ada panggilan masuk. Terima?")) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then((stream) => {
                            localStream = stream;
                            call.answer(stream); // Jawab panggilan & kirim suara kita
                            handleCallStream(call);
                        })
                        .catch((err) => {
                            console.error('Gagal akses mic:', err);
                            statusEl.innerText = "Gagal akses microphone.";
                        });
                } else {
                    // Jika ditolak, tutup koneksi (opsional: implementasi logic tolak)
                }
            });

            peer.on('error', (err) => {
                console.error(err);
                statusEl.innerText = "Error: " + err.type;
                resetUI();
            });
        }

        // 3. Memulai Panggilan (Outgoing)
        function initiateCall() {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) return alert("Masukkan ID teman terlebih dahulu!");

            statusEl.innerText = "Meminta akses microphone...";
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then((stream) => {
                    localStream = stream;
                    statusEl.innerText = "Menghubungkan...";
                    
                    const call = peer.call(remoteId, stream);
                    handleCallStream(call);
                })
                .catch((err) => {
                    console.error('Gagal akses mic:', err);
                    alert("Aplikasi butuh akses microphone untuk menelpon.");
                    statusEl.innerText = "Izin mic ditolak.";
                });
        }

        // Helper: Menangani Stream Audio (Saat tersambung)
        function handleCallStream(call) {
            currentCall = call;
            
            // Saat stream dari lawan bicara diterima
            call.on('stream', (remoteStream) => {
                statusEl.innerText = "📞 Sedang berbicara";
                remoteAudio.srcObject = remoteStream;
                toggleCallUI(true);
            });

            call.on('close', () => {
                endCall();
            });
        }

        // 4. Mengakhiri Panggilan
        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            statusEl.innerText = "Panggilan berakhir.";
            setTimeout(() => {
                statusEl.innerText = "Siap untuk memanggil.";
            }, 2000);
            
            resetUI();
        }

        // UI Helpers
        function toggleCallUI(isCalling) {
            if (isCalling) {
                btnCall.classList.add('hidden');
                inputArea.classList.add('hidden');
                btnEnd.style.display = 'block';
                document.querySelector('.phone-card').classList.add('pulse');
            } else {
                resetUI();
            }
        }

        function resetUI() {
            btnCall.classList.remove('hidden');
            inputArea.classList.remove('hidden');
            btnEnd.style.display = 'none';
            document.querySelector('.phone-card').classList.remove('pulse');
            currentCall = null;
            localStream = null;
        }

        function copyId() {
            const idText = myIdEl.innerText;
            if(idText === '...') return;
            navigator.clipboard.writeText(idText).then(() => {
                const originalText = statusEl.innerText;
                statusEl.innerText = "ID disalin ke clipboard!";
                setTimeout(() => statusEl.innerText = originalText, 2000);
            });
        }

        // Jalankan saat load
        initPeer();

    </script>
</body>
</html>
