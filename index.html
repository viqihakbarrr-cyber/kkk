<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beat The Circle 3D</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            color: white;
            user-select: none;
        }

        /* --- UI Overlay & Containers --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Biar klik tembus ke canvas saat main */
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* --- Screens --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
            transition: opacity 0.5s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        h1 { font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; color: #fff; text-shadow: 0 0 10px #00f; }
        h2 { font-size: 1.5rem; color: #aaa; margin-bottom: 30px; }

        /* --- Buttons & Inputs --- */
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: transparent;
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        button:hover { background: white; color: black; box-shadow: 0 0 20px rgba(255,255,255,0.5); }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; background: transparent; box-shadow: none; }

        input[type="text"] {
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            background: #222;
            border: 2px solid #555;
            color: white;
            border-radius: 10px;
            width: 200px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }
        input[type="file"] { display: none; }
        .file-upload-btn { background: #00f; border-color: #00f; }

        /* --- HUD (Heads Up Display) --- */
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #feedback-text {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            transition: transform 0.1s;
        }

        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            border: 1px solid white;
            background: rgba(0,0,0,0.5);
            color: white;
            cursor: pointer;
            z-index: 100;
            pointer-events: auto;
        }

        /* --- Orientation Warning --- */
        #orientation-warning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
        }
        
        @media (orientation: portrait) {
            #orientation-warning { display: flex; }
        }

        /* Animations */
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div style="font-size: 3rem;">⚠️</div>
        <h1>PUTAR HP ANDA</h1>
        <p>Game ini hanya bisa dimainkan dalam mode Landscape.</p>
    </div>

    <div id="game-container"></div>

    <div id="ui-layer">
        
        <div id="score-board">SKOR: <span id="score-val">0</span></div>
        
        <div id="feedback-text">PERFECT</div>

        <button id="fullscreen-btn" onclick="toggleFullScreen()">⛶</button>

        <div id="screen-lobby" class="screen interactive">
            <h1>BEAT THE CIRCLE</h1>
            <p style="margin-bottom: 40px; color: #888;">Co-op Rhythm Game</p>
            
            <div id="lobby-buttons">
                <button onclick="createRoom()">Create Room</button>
                <button onclick="showJoinInput()">Join Room</button>
            </div>

            <div id="join-container" style="display:none; flex-direction: column; align-items: center;">
                <input type="text" id="room-code-input" placeholder="0000" maxlength="4">
                <div>
                    <button onclick="joinRoom()">Connect</button>
                    <button onclick="resetLobby()" style="font-size: 0.8rem; border: none;">Cancel</button>
                </div>
            </div>

            <div id="status-msg" style="margin-top:20px; color: yellow;"></div>
        </div>

        <div id="screen-host" class="screen interactive hidden">
            <h1>ROOM: <span id="display-room-code" style="color:#00f">----</span></h1>
            <h2 id="host-status">Menunggu Player 2...</h2>
            
            <div id="host-controls" style="display:none; flex-direction: column; align-items: center;">
                <input type="file" id="audio-file" accept="audio/mp3" onchange="handleFileUpload(this)">
                <button class="file-upload-btn" onclick="document.getElementById('audio-file').click()">
                    1. Unggah Lagu (MP3)
                </button>
                <p id="file-name" style="font-size: 0.8rem; color: #aaa; margin-bottom: 20px;">Belum ada lagu</p>
                
                <button id="btn-play" disabled onclick="startGameHost()">2. PLAY GAME</button>
            </div>
        </div>

        <div id="screen-joiner" class="screen interactive hidden">
            <h1>CONNECTED</h1>
            <h2>Menunggu Host memulai game...</h2>
            <p>Tugas Anda: Kontrol Vertikal (Atas/Bawah)</p>
        </div>

    </div>

    <script>
        // --- Game Config & State ---
        const CONFIG = {
            sphereSpeed: 0.5,
            spawnZ: -60,
            hitZ: 0,
            gridSize: 20,
            colors: {
                perfect: '#bf00ff', // Ungu
                good: '#00ff00',    // Hijau
                great: '#aaaaaa',   // Abu
                miss: '#ff0000'
            }
        };

        let state = {
            score: 0,
            isPlaying: false,
            role: null, // 'host' or 'client'
            myAxis: null, // 'x' or 'y'
            peer: null,
            conn: null,
            audioCtx: null,
            analyser: null,
            dataArray: null,
            source: null,
            audioBuffer: null
        };

        // Objects
        let scene, camera, renderer, ring, grid;
        let spheres = []; // Array of { mesh, id, processed }
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let targetPos = new THREE.Vector2(0, 0); // Posisi target ring (X dari P1, Y dari P2)

        // --- 1. SETUP THREE.JS ---
        function initThree() {
            const container = document.getElementById('game-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // Hitam pekat
            scene.fog = new THREE.Fog(0x000000, 10, 60); // Kabut biar bola muncul halus

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(0, 10, 10);
            scene.add(pointLight);

            // Grid Floor
            grid = new THREE.GridHelper(50, 20, 0x444444, 0x222222);
            grid.position.y = -5;
            scene.add(grid);

            // Player Ring (Outline Circle)
            const geometry = new THREE.RingGeometry(2.8, 3, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            ring = new THREE.Mesh(geometry, material);
            ring.position.z = CONFIG.hitZ;
            scene.add(ring);

            // Listener Resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Input Listeners (Drag)
            document.addEventListener('mousemove', onInputMove);
            document.addEventListener('touchmove', onInputMove, { passive: false });
            
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 2. LOGIC GAMEPLAY & RENDER LOOP ---

        // Input Handling (Drag)
        function onInputMove(e) {
            if (!state.isPlaying) return;
            e.preventDefault();

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Normalisasi mouse ke -1 s/d 1
            const xNorm = (clientX / window.innerWidth) * 2 - 1;
            const yNorm = -(clientY / window.innerHeight) * 2 + 1;

            // Map ke posisi dunia (kurang lebih range -15 sampai 15 untuk X, -10 sampai 10 untuk Y)
            // Kita batasi area gerak
            const rangeX = 12;
            const rangeY = 8;

            let val = 0;
            if (state.myAxis === 'x') {
                val = xNorm * rangeX;
                targetPos.x = val;
                // Kirim ke partner
                sendData({ type: 'move', val: val });
            } else if (state.myAxis === 'y') {
                val = yNorm * rangeY;
                targetPos.y = val;
                // Kirim ke partner
                sendData({ type: 'move', val: val });
            }
        }

        // Main Loop
        function animate() {
            requestAnimationFrame(animate);

            if (!state.isPlaying) {
                renderer.render(scene, camera);
                return;
            }

            // Update Ring Position (Smooth lerp)
            ring.position.x += (targetPos.x - ring.position.x) * 0.2;
            ring.position.y += (targetPos.y - ring.position.y) * 0.2;

            // Audio Analysis (HOST Only) untuk Spawn Bola
            if (state.role === 'host' && state.analyser) {
                detectBeat();
            }

            // Update Spheres
            for (let i = spheres.length - 1; i >= 0; i--) {
                const s = spheres[i];
                s.mesh.position.z += CONFIG.sphereSpeed;

                // Rotasi sedikit biar dinamis
                s.mesh.rotation.x += 0.01;
                s.mesh.rotation.y += 0.01;

                // Cek Collision (Hanya Host yang hitung skor untuk sinkronisasi)
                if (state.role === 'host' && !s.processed) {
                    // Jika melewati ring (z > 0)
                    if (s.mesh.position.z >= CONFIG.hitZ) {
                        checkHit(s, i);
                    }
                } else if (state.role === 'client' && s.mesh.position.z > 5) {
                    // Cleanup visual di client
                    scene.remove(s.mesh);
                    spheres.splice(i, 1);
                }
            }

            // Gerakan Grid agar terasa maju
            grid.position.z += CONFIG.sphereSpeed;
            if (grid.position.z >= CONFIG.gridSize) grid.position.z = 0;

            renderer.render(scene, camera);
        }

        // Spawn Sphere Logic
        function spawnSphere(x, y) {
            const geometry = new THREE.SphereGeometry(1.5, 32, 32);
            // Warna Biru (0x0000ff) + Emissive biar nyala
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x0055ff, 
                emissive: 0x0000aa,
                emissiveIntensity: 0.5,
                roughness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(x, y, CONFIG.spawnZ);
            scene.add(mesh);
            spheres.push({ mesh: mesh, processed: false });
        }

        // Logic Beat Detection Sederhana
        let lastSpawnTime = 0;
        function detectBeat() {
            state.analyser.getByteFrequencyData(state.dataArray);
            
            // Ambil rata-rata frekuensi rendah (Bass)
            let sum = 0;
            const bassCount = 10; 
            for(let i = 0; i < bassCount; i++) {
                sum += state.dataArray[i];
            }
            const average = sum / bassCount;

            const now = Date.now();
            // Threshold sensitivitas dan cooldown min 400ms
            if (average > 230 && now - lastSpawnTime > 400) { 
                triggerSpawn();
                lastSpawnTime = now;
            }
            // Fallback: Jika lagu sepi, spawn random sesekali
            else if (now - lastSpawnTime > 2000) {
                triggerSpawn();
                lastSpawnTime = now;
            }
        }

        function triggerSpawn() {
            // Posisi random dalam jangkauan layar
            const rX = (Math.random() * 20) - 10;
            const rY = (Math.random() * 12) - 6;
            
            // Spawn lokal
            spawnSphere(rX, rY);
            // Kirim perintah spawn ke client
            sendData({ type: 'spawn', x: rX, y: rY });
        }

        // Hit Detection (Host Only)
        function checkHit(s, index) {
            s.processed = true;
            
            // Jarak antara tengah bola dan tengah ring
            const dx = s.mesh.position.x - ring.position.x;
            const dy = s.mesh.position.y - ring.position.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            let result = "MISS";
            let color = CONFIG.colors.miss;

            if (dist < 1.0) { // Masuk area
                if (dist < 0.3) {
                    result = "PERFECT";
                    color = CONFIG.colors.perfect;
                    state.score += 100;
                } else if (dist < 1.5) {
                    result = "GOOD";
                    color = CONFIG.colors.good;
                    state.score += 50;
                } else {
                    result = "GREAT";
                    color = CONFIG.colors.great;
                    state.score += 20;
                }
            } else {
                // Miss
                state.score = Math.max(0, state.score - 10);
            }

            // Hapus bola visual
            scene.remove(s.mesh);
            spheres.splice(index, 1);

            // Update UI & Broadcast
            showFeedback(result, color);
            updateScoreUI();
            sendData({ type: 'result', text: result, color: color, score: state.score });
        }

        // --- 3. UI & FEEDBACK ---
        function showFeedback(text, colorStr) {
            const el = document.getElementById('feedback-text');
            el.innerText = text;
            el.style.color = colorStr;
            
            // Trigger animation CSS
            el.style.animation = 'none';
            el.offsetHeight; /* trigger reflow */
            el.style.animation = 'pop 0.5s ease-out forwards';
        }

        function updateScoreUI() {
            document.getElementById('score-val').innerText = state.score;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- 4. PEER JS & MULTIPLAYER LOGIC ---
        
        // Helper: Generate 4 digit code
        function generateRoomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }
        
        // Prefix agar ID unik di server publik peerjs
        const ID_PREFIX = "btc-game-v1-"; 

        function initPeer(id) {
            state.peer = new Peer(ID_PREFIX + id);
            
            state.peer.on('open', (id) => {
                console.log('My ID: ' + id);
            });

            state.peer.on('error', (err) => {
                console.error(err);
                document.getElementById('status-msg').innerText = "Error: ID mungkin sudah dipakai.";
            });
        }

        // HOST FLOW
        function createRoom() {
            const code = generateRoomCode();
            initPeer(code);
            
            state.role = 'host';
            state.myAxis = 'x'; // Host control X
            targetPos.y = 0; // Default

            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-host').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = code;

            // Tunggu koneksi
            state.peer.on('connection', (conn) => {
                state.conn = conn;
                setupConnectionHandlers();
                document.getElementById('host-status').innerText = "Player 2 Terhubung!";
                document.getElementById('host-status').style.color = "#0f0";
                document.getElementById('host-controls').style.display = 'flex';
                
                // Kirim Role ke Client
                setTimeout(() => {
                    sendData({ type: 'init', role: 'client' });
                }, 1000);
            });
        }

        // CLIENT FLOW
        function showJoinInput() {
            document.getElementById('lobby-buttons').style.display = 'none';
            document.getElementById('join-container').style.display = 'flex';
        }

        function resetLobby() {
            document.getElementById('lobby-buttons').style.display = 'block';
            document.getElementById('join-container').style.display = 'none';
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value;
            if (code.length !== 4) {
                alert("Masukkan 4 digit kode!");
                return;
            }

            // Client ID random
            const myTempId = generateRoomCode() + generateRoomCode(); 
            initPeer(myTempId);

            state.peer.on('open', () => {
                // Connect ke Host
                const conn = state.peer.connect(ID_PREFIX + code);
                
                conn.on('open', () => {
                    state.conn = conn;
                    state.role = 'client';
                    state.myAxis = 'y'; // Client control Y
                    
                    document.getElementById('screen-lobby').classList.add('hidden');
                    document.getElementById('screen-joiner').classList.remove('hidden');
                    
                    setupConnectionHandlers();
                });

                conn.on('error', (err) => {
                    alert("Gagal konek. Cek kode.");
                });
            });
        }

        // DATA HANDLING
        function setupConnectionHandlers() {
            state.conn.on('data', (data) => {
                handleData(data);
            });
        }

        function sendData(data) {
            if (state.conn && state.conn.open) {
                state.conn.send(data);
            }
        }

        function handleData(data) {
            if (data.type === 'move') {
                // Update posisi lawan
                if (state.role === 'host') targetPos.y = data.val;
                if (state.role === 'client') targetPos.x = data.val;
            } 
            else if (data.type === 'start') {
                // Client mulai game
                document.getElementById('ui-layer').classList.add('hidden-ui'); // hide menus
                // Hide semua screen UI
                document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
                state.isPlaying = true;
            }
            else if (data.type === 'spawn') {
                // Client spawn bola visual
                spawnSphere(data.x, data.y);
            }
            else if (data.type === 'result') {
                // Tampilkan hasil hitungan host
                showFeedback(data.text, data.color);
                state.score = data.score;
                updateScoreUI();
            }
        }

        // --- 5. AUDIO HANDLING (HOST) ---
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('file-name').innerText = file.name;
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-play').style.borderColor = "#0f0";
            document.getElementById('btn-play').style.color = "#0f0";

            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                state.audioCtx.decodeAudioData(arrayBuffer, function(buffer) {
                    state.audioBuffer = buffer;
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function startGameHost() {
            if (!state.audioBuffer) return;

            // Setup Audio Graph
            state.source = state.audioCtx.createBufferSource();
            state.source.buffer = state.audioBuffer;
            
            state.analyser = state.audioCtx.createAnalyser();
            state.analyser.fftSize = 256;
            state.source.connect(state.analyser);
            state.analyser.connect(state.audioCtx.destination);
            
            state.dataArray = new Uint8Array(state.analyser.frequencyBinCount);

            state.source.start(0);

            // Hide UI
            document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
            
            state.isPlaying = true;
            
            // Beritahu Client untuk mulai
            sendData({ type: 'start' });

            // Handle lagu selesai
            state.source.onended = () => {
                alert("Game Selesai! Skor Akhir: " + state.score);
                location.reload();
            };
        }

        // --- INIT ---
        initThree();

    </script>
</body>
</html>
