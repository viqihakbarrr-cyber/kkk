<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELUNO - REALISTIC UPDATE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            /* REKONSTRUKSI 2: BACKGROUND BARU */
            background-image: url('https://github.com/viqihakbarrr-cyber/kkk/blob/main/BG.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
            /* Canvas transparan agar background body terlihat */
            background: transparent; 
        }

        /* UI Layers */
        #ui-layer, #lobby-screen, #loading-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: none;
        }

        /* Interactive Layers */
        #lobby-screen, #game-over, #fs-toggle {
            pointer-events: auto;
        }

        #lobby-screen {
            background: rgba(0, 0, 0, 0.85); /* Sedikit transparan agar BG terlihat samar */
            z-index: 200;
            backdrop-filter: blur(8px);
        }

        /* Loading Layer */
        #loading-layer {
            background: #000;
            z-index: 300;
            display: flex;
        }
        
        .spinner {
            width: 60px; height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #9933FF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text { 
            color: #9933FF; 
            font-size: 24px; 
            letter-spacing: 3px; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(153, 51, 255, 0.5);
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 40px rgba(153, 51, 255, 0.3);
            border: 4px solid #333;
            max-width: 90%;
            width: 400px;
        }

        h1 { margin: 0 0 20px 0; color: #000; font-size: 28px; letter-spacing: 2px; }
        h2 { margin: 0 0 15px 0; color: #333; font-size: 18px; }
        
        .input-group { margin-bottom: 20px; }
        input[type="number"] {
            padding: 10px; font-family: 'Orbitron'; font-size: 24px; text-align: center;
            border: 2px solid #333; border-radius: 10px; width: 150px; outline: none;
        }
        input[type="number"]:focus { border-color: #9933FF; }

        .room-code-display {
            font-size: 36px; font-weight: bold; color: #9933FF; margin: 20px 0;
            letter-spacing: 5px;
        }

        button.main-btn {
            padding: 15px 30px;
            background: #000;
            border: none; color: white;
            font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.2s;
            margin: 10px;
            min-width: 150px;
        }

        button.main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        button.main-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 15px rgba(153, 51, 255, 0.5); }
        button.main-btn.active { background: linear-gradient(45deg, #7700FF, #CC44FF); }

        .btn-secondary { background: #555 !important; }

        #game-over {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 20px;
            text-align: center; border: 3px solid #333;
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* REKONSTRUKSI 3: TOMBOL FULLSCREEN MINIMALIS */
        #fs-toggle {
            position: absolute;
            top: 15px; right: 15px;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        #fs-toggle:hover { background: #9933FF; border-color: #fff; }
        #fs-icon {
            width: 20px; height: 20px;
            border: 2px solid white;
            border-top: none; border-left: none; /* Icon panah simple */
            transform: rotate(45deg) translate(-2px, -2px);
        }
        #fs-icon::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid white; border-bottom: none; border-right: none;
            transform: translate(-10px, -10px);
        }

        .hidden { display: none !important; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="fs-toggle" onclick="toggleFullscreen()">
        <div style="color:white; font-size:24px; font-weight:bold;">&#x26F6;</div>
    </div>

    <div id="loading-layer">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-msg">LOADING 0%</div>
    </div>

    <div id="lobby-screen" class="hidden">
        <div class="modal-box" id="lobby-main">
            <h1>MULTIPLAYER</h1>
            <p style="color:#666; margin-bottom:20px;">DRAG & DROP EDITION</p>
            <button class="main-btn active" onclick="createRoom()">CREATE ROOM</button>
            <br>
            <button class="main-btn btn-secondary" onclick="showJoinUI()">JOIN ROOM</button>
        </div>
        <div class="modal-box hidden" id="lobby-wait">
            <h2>ROOM CODE</h2>
            <div class="room-code-display" id="host-room-code">----</div>
            <p>Waiting for opponent...</p>
            <div class="spinner" style="width:30px; height:30px; margin: 0 auto; border-width: 4px;"></div>
            <br>
            <button class="main-btn btn-secondary" onclick="resetLobby()">CANCEL</button>
        </div>
        <div class="modal-box hidden" id="lobby-join">
            <h2>ENTER CODE</h2>
            <div class="input-group">
                <input type="number" id="join-code-input" placeholder="0000" maxlength="4">
            </div>
            <button class="main-btn active" onclick="joinRoom()">JOIN</button>
            <br>
            <button class="main-btn btn-secondary" onclick="resetLobby()">BACK</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="game-over">
            <h1 id="winner-text">YOU WIN!</h1>
            <p id="sub-winner-text" style="color:#666; margin-bottom:20px;">Opponent Disconnected</p>
            <button class="main-btn active" onclick="location.reload()">MAIN MENU</button>
        </div>
    </div>

<script>
// --- ASSET MANAGEMENT ---
const ASSETS_URL = {
    fire: 'https://github.com/viqihakbarrr-cyber/kkk/blob/main/BCfire.png?raw=true',
    water: 'https://github.com/viqihakbarrr-cyber/kkk/blob/main/BCwater.png?raw=true',
    leaf: 'https://github.com/viqihakbarrr-cyber/kkk/blob/main/BCleaf.png?raw=true',
    moon: 'https://github.com/viqihakbarrr-cyber/kkk/blob/main/SCpurple.png?raw=true',
    back: 'https://github.com/viqihakbarrr-cyber/kkk/blob/main/Back.png?raw=true'
    // REKONSTRUKSI 1: Deck.png dihapus
};

const IMAGES = {};
let assetsLoaded = false;

function loadAssets() {
    let loadedCount = 0;
    const keys = Object.keys(ASSETS_URL);
    const total = keys.length;
    const msg = document.getElementById('loading-msg');

    keys.forEach(key => {
        const img = new Image();
        img.src = ASSETS_URL[key];
        img.onload = () => {
            loadedCount++;
            const percent = Math.round((loadedCount / total) * 100);
            msg.innerText = `LOADING ${percent}%`;
            if(loadedCount >= total) {
                assetsLoaded = true;
                setTimeout(() => {
                    document.getElementById('loading-layer').classList.add('hidden');
                    // REKONSTRUKSI 3: Langsung ke Lobby, tidak ada start screen
                    document.getElementById('lobby-screen').classList.remove('hidden');
                }, 800);
            }
        };
        img.onerror = () => { alert("Failed to load asset: " + key); };
        IMAGES[key] = img;
    });
}
loadAssets();

// --- KONFIGURASI NETWORK ---
let peer = null;
let conn = null;
let myPeerID = null;
let isHost = false;
const ID_PREFIX = "eluno-moon-v1-";

// --- KONFIGURASI CANVAS & GAME ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let floatingTexts = [];

// RASIO KARTU & SKALA
const CARD_RATIO = 2.5 / 3.6; 
let cardScale = 1;
let cardW = 100;
let cardH = 165;

const SUITS = ['fire', 'water', 'leaf', 'moon'];
const BASIC_SUITS = ['fire', 'water', 'leaf'];
const COLORS = { fire: '#FF2222', water: '#0088FF', leaf: '#00CC44', moon: '#9933FF' };
const COUNTER_MAP = { fire: 'leaf', leaf: 'water', water: 'fire' };

let deck = [];
let discardPile = [];
let myHand = [];
let opponentHand = []; 
let turn = ''; 
let gameState = 'MENU'; 
let isAnimating = false; 

// Interaksi State
let selectedIdx = -1;
let dragIdx = -1;
let dragOffsetX = 0;
let dragOffsetY = 0;

let blindMode = false;
let blindIntensity = 0; 
let mustPlayBasic = false; 

// Audio Context
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let t = audioCtx.currentTime;
    
    if (type === 'play') {
        osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'flip') {
        // Suara saat kartu berbalik
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(500, t + 0.1);
        gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(); osc.stop(t + 0.1);
    } else if (type === 'moon') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(100, t); osc.frequency.linearRampToValueAtTime(50, t + 1);
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 1);
        osc.start(); osc.stop(t + 1);
    } else if (type === 'deal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t + 0.08);
        osc.start(); osc.stop(t + 0.08);
    } else if (type === 'crit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(600, t + 0.3);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(); osc.stop(t + 0.3);
    } else if (type === 'error') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, t); 
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(); osc.stop(t + 0.2);
    }
}

class Card {
    constructor(suit, value) {
        this.suit = suit; this.value = value;
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = 60; this.y = height/2; 
        this.targetX = width / 2; this.targetY = height / 2;
        this.shake = 0;
        
        // State visual
        this.isHovered = false;
        this.isSelected = false; 
        this.isDragging = false; 

        // REKONSTRUKSI 1: Animasi Flip & FaceUp Logic
        this.isFaceUp = true; // Default true, diubah false jika baru draw
        this.scaleX = 1;      // Untuk efek flip (1 -> 0 -> 1)
        this.flipping = false;
    }

    draw(ctx, forceFaceUp, x, y, w, h) {
        let drawW = w || cardW;
        let drawH = h || cardH;

        // Logic Gerakan
        if (this.isDragging) {
            this.x = x; this.y = y;
        } else {
            // Smooth Interpolation
            this.x += (this.targetX - this.x) * 0.15;
            this.y += (this.targetY - this.y) * 0.15;

            // REKONSTRUKSI 1: Cek Flip Trigger saat hampir sampai
            // Jika kartu sedang tertutup, tidak sedang flipping, dan sudah dekat target
            if (!this.isFaceUp && !this.flipping && Math.abs(this.x - this.targetX) < 10 && Math.abs(this.y - this.targetY) < 10) {
                this.startFlip();
            }
        }

        // Logic Flip Animation
        if (this.flipping) {
            if (!this.isFaceUp) {
                // Tahap 1: Mengecil (1 -> 0)
                this.scaleX -= 0.15;
                if (this.scaleX <= 0) {
                    this.scaleX = 0;
                    this.isFaceUp = true; // Ganti gambar saat tipis
                    playSound('flip');
                }
            } else {
                // Tahap 2: Membesar (0 -> 1)
                this.scaleX += 0.15;
                if (this.scaleX >= 1) {
                    this.scaleX = 1;
                    this.flipping = false; // Selesai
                }
            }
        }

        // Shake logic
        let offsetX = 0;
        if (this.shake > 0) {
            offsetX = Math.sin(Date.now() * 0.5) * 5;
            this.shake -= 1;
        }

        const finalX = this.x + offsetX;
        const finalY = this.y;

        ctx.save();
        ctx.translate(finalX, finalY);

        // Scale efek saat highlight/drag + efek FLIP
        let s = 1.0;
        if(this.isSelected) s = 1.1;
        if(this.isDragging) s = 1.15;
        
        // Gabungkan scale flip dan scale interaksi
        ctx.scale(s * this.scaleX, s);

        // Tentukan apa yang digambar (Face Up atau Back)
        // Gunakan parameter forceFaceUp jika ada (misal di discard pile selalu terbuka)
        // Jika tidak, gunakan state this.isFaceUp
        let showFace = (forceFaceUp !== undefined) ? forceFaceUp : this.isFaceUp;

        if (showFace) {
            // Shadow
            ctx.shadowColor = this.suit === 'moon' ? COLORS.moon : 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = this.suit === 'moon' ? 20 : (this.isSelected || this.isDragging ? 25 : 5);
            ctx.shadowOffsetY = (this.isSelected || this.isDragging) ? 15 : 5;

            // Draw Image
            if (IMAGES[this.suit]) {
                ctx.drawImage(IMAGES[this.suit], -drawW/2, -drawH/2, drawW, drawH);
            } else {
                ctx.fillStyle = '#fff';
                ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
            }
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

            // Typography Angka
            if (this.suit !== 'moon') {
                ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 3; 
                let fontSize = drawW * 0.22; ctx.font = `900 ${fontSize}px Orbitron`;
                let padX = drawW * 0.08; let padY = drawH * 0.08;

                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.strokeText(this.value, -drawW/2 + padX, -drawH/2 + padY);
                ctx.fillText(this.value, -drawW/2 + padX, -drawH/2 + padY);

                ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
                ctx.strokeText(this.value, drawW/2 - padX, drawH/2 - padY);
                ctx.fillText(this.value, drawW/2 - padX, drawH/2 - padY);
            }
        } else {
            // Kartu tertutup (Back)
            ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5;
            if(IMAGES.back) {
                ctx.drawImage(IMAGES.back, -drawW/2, -drawH/2, drawW, drawH);
            } else {
                ctx.fillStyle = '#333'; ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
            }
        }
        ctx.restore();
    }

    startFlip() {
        this.flipping = true;
    }
}

class Particle {
    constructor(x, y, color, isExplosion) {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 5 + 2;
        let speed = isExplosion ? 15 : 10;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.life = 1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.02; this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill(); ctx.globalAlpha = 1;
    }
}

// --- FUNGSI LOBBY & NETWORK ---
function showLoading(msg) {
    const layer = document.getElementById('loading-layer');
    layer.classList.remove('hidden');
    layer.style.background = 'rgba(0,0,0,0.8)';
    document.getElementById('loading-msg').innerText = msg;
}
function hideLoading() { document.getElementById('loading-layer').classList.add('hidden'); }

// REKONSTRUKSI 3: Fungsi Toggle Fullscreen
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

function createRoom() {
    const code = Math.floor(1000 + Math.random() * 9000).toString();
    const fullID = ID_PREFIX + code;
    showLoading("CREATING ROOM...");
    peer = new Peer(fullID);
    peer.on('open', (id) => {
        hideLoading(); isHost = true; myPeerID = id;
        document.getElementById('lobby-main').classList.add('hidden');
        document.getElementById('lobby-wait').classList.remove('hidden');
        document.getElementById('host-room-code').innerText = code;
    });
    peer.on('connection', (c) => {
        conn = c; setupConnection();
        showFloatingText("PLAYER JOINED!", width/2, height/2, "#0f0");
        setTimeout(startMultiplayerGame, 1000);
    });
    peer.on('error', (err) => { hideLoading(); alert("Error: " + err); resetLobby(); });
}
function showJoinUI() {
    document.getElementById('lobby-main').classList.add('hidden');
    document.getElementById('lobby-join').classList.remove('hidden');
}
function joinRoom() {
    const input = document.getElementById('join-code-input').value;
    if (input.length !== 4) { alert("Enter 4 digits code!"); return; }
    showLoading("JOINING ROOM...");
    const targetID = ID_PREFIX + input;
    peer = new Peer(); 
    peer.on('open', () => { conn = peer.connect(targetID); setupConnection(); });
    peer.on('error', () => { hideLoading(); alert("Room not found!"); resetLobby(); });
}
function resetLobby() {
    if(peer) peer.destroy(); peer = null; conn = null;
    document.getElementById('lobby-main').classList.remove('hidden');
    document.getElementById('lobby-wait').classList.add('hidden');
    document.getElementById('lobby-join').classList.add('hidden');
    hideLoading();
}
function setupConnection() {
    conn.on('open', () => { console.log("Connected"); });
    conn.on('data', (data) => { handleNetworkData(data); });
    conn.on('close', () => { endGame("DISCONNECTED", "Opponent left the game"); });
}

// --- DATA HANDLING ---
function handleNetworkData(data) {
    if (data.type === 'START_GAME') {
        document.getElementById('lobby-screen').classList.add('hidden');
        hideLoading(); gameState = 'PLAYING';
        turn = data.turn === 'p2' ? 'me' : 'opponent';
        let myStartCards = data.p2Hand.map(c => new Card(c.suit, c.value));
        let topCard = new Card(data.topDiscard.suit, data.topDiscard.value);
        playDealAnimation(myStartCards, data.p1HandCount, topCard);
    } else if (data.type === 'OPPONENT_MOVE') {
        processOpponentMove(data.card, data.isCrit);
    } else if (data.type === 'OPPONENT_DRAW') {
        // REKONSTRUKSI 1: Animasi Draw Opponent
        // Kartu spawn dari Deck (bukan langsung di tangan)
        let c = new Card('fire', 1); 
        c.x = 60; c.y = height/2; // Mulai dari deck
        c.isFaceUp = false; // Tertutup
        opponentHand.push(c); 
        playSound('deal');
        showFloatingText("Opponent Drew", width/2, 100, "#aaa");
        turn = 'me';
    } else if (data.type === 'MOON_ATTACK') {
        if(opponentHand.length > 0) opponentHand.pop();
        let moonC = new Card('moon', 0); moonC.x = width/2; moonC.y = -100;
        moonC.targetX = width/2; moonC.targetY = height/2;
        discardPile.push(moonC);
        setTimeout(() => {
            spawnExplosion(width/2, height/2, COLORS.moon); playSound('moon');
            blindMode = true; blindIntensity = 1.0; 
            showFloatingText("BLINDED!", width/2, height/2, "#FFF");
        }, 300);
    } else if (data.type === 'MOON_FOLLOWUP') {
        processOpponentMove(data.card, data.isCrit);
        showFloatingText("ONE SHOT CHANCE", width/2, height/2 + 50, "red");
    } else if (data.type === 'BLIND_CLEARED') {
        blindMode = false; blindIntensity = 0;
        showFloatingText("DARKNESS FADED", width/2, height/2, "#FFF");
        processOpponentMove(data.card, data.isCrit);
    } else if (data.type === 'BLIND_FAIL') {
        showFloatingText("MISSED!", width/2, 150, "red"); turn = 'me'; 
    } else if (data.type === 'EXTRA_CARD') {
        // Penalty Draw
        let c = data.card; let nc = new Card(c.suit, c.value);
        nc.x = 60; nc.y = height/2; // Dari Deck
        nc.isFaceUp = false; // Tertutup dulu
        nc.targetX = width/2; nc.targetY = -200; // Sementara ke atas lalu nanti diatur loop
        myHand.push(nc); playSound('deal');
        showFloatingText("Penalty!", width/2, height/2+50, "red");
    } else if (data.type === 'PENALTY_SYNC') {
        let c = new Card('fire', 1); c.x = 60; c.y = height/2; c.isFaceUp = false;
        opponentHand.push(c); playSound('deal');
        showFloatingText("Opponent Penalized!", width/2, 100, "red");
    }
}

// --- GAME LOGIC ---
function startMultiplayerGame() {
    document.getElementById('lobby-screen').classList.add('hidden');
    gameState = 'PLAYING';
    let realDeck = [];
    BASIC_SUITS.forEach(suit => {
        for (let i = 1; i <= 9; i++) { realDeck.push({suit, value: i}); if(i <= 5) realDeck.push({suit, value: i}); }
    });
    realDeck.push({suit: 'moon', value: 0}); realDeck.push({suit: 'moon', value: 0});
    for (let i = realDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [realDeck[i], realDeck[j]] = [realDeck[j], realDeck[i]]; }
    
    let p1H = realDeck.splice(0, 6);
    let p2H = realDeck.splice(0, 6);
    let top;
    while(true) { top = realDeck.pop(); if(top.suit !== 'moon') break; realDeck.unshift(top); }
    
    let myStartCards = p1H.map(c => new Card(c.suit, c.value));
    let topCardObj = new Card(top.suit, top.value);
    turn = Math.random() > 0.5 ? 'me' : 'opponent';

    conn.send({
        type: 'START_GAME', deckCount: realDeck.length, topDiscard: top,
        p1HandCount: 6, p2Hand: p2H, turn: turn === 'me' ? 'p1' : 'p2'
    });
    playDealAnimation(myStartCards, 6, topCardObj);
}

function playDealAnimation(myCards, oppCount, topCard) {
    isAnimating = true; myHand = []; opponentHand = []; discardPile = [];
    let dealSpeed = 150; let totalCards = myCards.length + oppCount; let dealt = 0;
    
    let dealInterval = setInterval(() => {
        if (dealt >= totalCards) {
            clearInterval(dealInterval);
            setTimeout(() => {
                topCard.x = 60; topCard.y = height/2; discardPile.push(topCard);
                playSound('play'); isAnimating = false;
                setTimeout(() => { showFloatingText(turn === 'me' ? "YOUR TURN" : "OPPONENT'S TURN", width/2, height/2 + 100, turn==='me'?"#0f0":"#fff"); }, 500);
            }, 300);
            return;
        }
        
        let c;
        if (dealt % 2 === 0) {
            // Opponent card (always face down)
            c = new Card('fire', 1); 
            c.x = 60; c.y = height/2; 
            c.isFaceUp = false;
            opponentHand.push(c);
        } else {
            // My card (Starts face down, flips later)
            let cardIndex = Math.floor(dealt / 2);
            if (myCards[cardIndex]) {
                c = myCards[cardIndex]; 
                c.x = 60; c.y = height/2;
                c.isFaceUp = false; // Penting: Mulai tertutup
                myHand.push(c);
            }
        }
        playSound('deal'); dealt++;
    }, dealSpeed);
}

function isValidMove(card, topCard) {
    if (card.suit === 'moon') return true; 
    if (topCard.suit === 'moon') return true; 
    return card.suit === topCard.suit || card.value === topCard.value;
}

function playerInput(cardIndex) {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating) return false;
    
    let card = myHand[cardIndex];
    let top = discardPile[discardPile.length - 1];

    card.isDragging = false; 

    if (blindMode && blindIntensity === 1.0) {
        if (isValidMove(card, top)) {
            executeMove(cardIndex, card, top, false);
            blindMode = false; blindIntensity = 0;
            conn.send({ 
                type: 'BLIND_CLEARED', card: { suit: card.suit, value: card.value },
                isCrit: (COUNTER_MAP[card.suit] === top.suit)
            });
            return true;
        } else {
            card.shake = 30; playSound('error');
            showFloatingText("WRONG CARD!", card.x, card.y - 70, "red");
            turn = 'opponent'; 
            conn.send({ type: 'BLIND_FAIL' });
            return false;
        }
    }

    if (mustPlayBasic) {
        if (card.suit === 'moon') {
            card.shake = 20; showFloatingText("Basic Card Only!", card.x, card.y - 70, "red");
            return false;
        }
        if (!BASIC_SUITS.includes(card.suit)) return false;
    }

    if (isValidMove(card, top)) {
        if (card.suit === 'moon') {
            executeMove(cardIndex, card, top, false);
            spawnExplosion(width/2, height/2, COLORS.moon);
            playSound('moon');
            blindMode = true; blindIntensity = 0.1; mustPlayBasic = true; 
            turn = 'me'; 
            showFloatingText("EXTRA TURN (Basic Only)", width/2, height/2 + 100, COLORS.moon);
            conn.send({ type: 'MOON_ATTACK' });
        } else {
            let isCrit = COUNTER_MAP[card.suit] === top.suit;
            executeMove(cardIndex, card, top, isCrit);
            if (mustPlayBasic) {
                mustPlayBasic = false;
                conn.send({ type: 'MOON_FOLLOWUP', card: { suit: card.suit, value: card.value }, isCrit: isCrit });
                turn = 'opponent'; 
            } else {
                conn.send({ type: 'OPPONENT_MOVE', card: { suit: card.suit, value: card.value }, isCrit: isCrit });
                turn = 'opponent';
            }
        }
        if(myHand.length === 0) endGame("YOU WIN!", "Victory Achieved");
        return true;
    } else {
        card.shake = 20;
        showFloatingText("Invalid Move", card.x, card.y - 50, "red");
        playSound('error');
        return false;
    }
}

function executeMove(index, card, top, isCrit) {
    card.isSelected = false;
    selectedIdx = -1;

    myHand.splice(index, 1);
    discardPile.push(card);
    card.targetX = width/2; card.targetY = height/2;
    playSound('play');

    if(isCrit) {
        playSound('crit');
        showFloatingText("CRITICAL! (+2)", width/2, height/2 - 50, COLORS[card.suit]);
        if(isHost) {
            for(let i=0; i<2; i++) {
                let penalty = drawCardFromDeckLogic(); 
                if(penalty) {
                    setTimeout(() => {
                        conn.send({ type: 'EXTRA_CARD', card: {suit:penalty.suit, value:penalty.value} });
                        let c = new Card('fire', 1); c.x=60; c.y=height/2; c.isFaceUp=false;
                        opponentHand.push(c); 
                    }, i * 200); 
                }
            }
        }
    }
}

function processOpponentMove(cardData, isCrit) {
    let card = new Card(cardData.suit, cardData.value);
    if(opponentHand.length > 0) opponentHand.pop(); 
    card.x = width/2; card.y = -100; // Datang dari atas
    card.targetX = width/2; card.targetY = height/2;
    discardPile.push(card);
    playSound('play');
    if(isCrit) {
        playSound('crit'); showFloatingText("CRITICAL HIT!", width/2, height/2 - 50, COLORS[cardData.suit]);
        if(isHost) {
            for(let i=0; i<2; i++) {
                let penalty = drawCardFromDeckLogic();
                if(penalty) {
                    setTimeout(() => {
                        penalty.x = 60; penalty.y = height/2; 
                        penalty.isFaceUp = false; // Draw tertutup dulu
                        myHand.push(penalty);
                        playSound('deal'); showFloatingText("+1 Card", width/2, height/2+50, "red");
                        conn.send({ type: 'PENALTY_SYNC' });
                    }, i * 200);
                }
            }
        }
    }
    setTimeout(() => { if(opponentHand.length === 0) endGame("YOU LOSE", "Opponent cleared their hand"); }, 500);
    turn = 'me';
}

function requestDraw() {
    if (gameState !== 'PLAYING' || turn !== 'me' || isAnimating) return;
    
    // REKONSTRUKSI 1: Draw Logic
    let newCard;
    if(isHost) newCard = drawCardFromDeckLogic();
    else {
        let r = Math.random();
        if(r < 0.05) newCard = new Card('moon', 0);
        else {
            let s = BASIC_SUITS[Math.floor(Math.random()*3)]; let v = Math.floor(Math.random()*9)+1;
            newCard = new Card(s, v);
        }
    }

    if(newCard) {
        // Penting: Set posisi awal di Deck & Tertutup
        newCard.x = 60; 
        newCard.y = height/2; 
        newCard.isFaceUp = false; 
        
        myHand.push(newCard); 
        playSound('deal');
        
        if (mustPlayBasic) {
            mustPlayBasic = false; conn.send({ type: 'OPPONENT_DRAW' }); turn = 'opponent';
            showFloatingText("Combo Skipped", width/2, height/2, "#aaa");
        } else {
            conn.send({ type: 'OPPONENT_DRAW' }); turn = 'opponent'; showFloatingText("Turn Ended", width/2, height/2, "#aaa");
        }
    }
}

function drawCardFromDeckLogic() {
    let r = Math.random(); if(r < 0.05) return new Card('moon', 0);
    let s = BASIC_SUITS[Math.floor(Math.random()*3)]; let v = Math.floor(Math.random()*9)+1;
    return new Card(s, v);
}

function spawnExplosion(x, y, color) { for(let i=0; i<30; i++) particles.push(new Particle(x, y, color, true)); }
function endGame(title, subtitle) {
    gameState = 'GAMEOVER';
    document.getElementById('winner-text').innerText = title;
    document.getElementById('sub-winner-text').innerText = subtitle;
    document.getElementById('game-over').style.display = 'block';
    setTimeout(()=> { if(peer) peer.destroy(); }, 2000);
}

// --- RENDER LOOP ---
function draw() {
    ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio||1), canvas.height / (window.devicePixelRatio||1));
    
    // REKONSTRUKSI 1: Render Visual Deck Stack (Tanpa Deck.png)
    // Tumpuk Back.png sebanyak 15 kali dengan offset kecil
    let deckX = 60; let deckY = height / 2;
    if (IMAGES.back) {
        let stackHeight = 15; // Jumlah kartu visual
        for (let i = 0; i < stackHeight; i++) {
            // Offset kartu sedikit ke atas-kiri setiap iterasi
            let off = i * 0.5; 
            ctx.save();
            ctx.translate(deckX - off, deckY - off);
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = i === stackHeight - 1 ? 5 : 0; // Bayangan cuma di paling atas
            ctx.drawImage(IMAGES.back, -cardW/2, -cardH/2, cardW, cardH);
            ctx.restore();
        }
    } else {
        // Fallback jika gambar belum load
        ctx.fillStyle = '#333'; ctx.fillRect(deckX - cardW/2, deckY - cardH/2, cardW, cardH);
    }

    // Render Discard Pile (Top 3)
    if (discardPile.length > 0) {
        let startIdx = Math.max(0, discardPile.length - 3);
        for(let i = startIdx; i < discardPile.length; i++) {
            let c = discardPile[i];
            if(!isAnimating && Math.abs(c.x - width/2) < 2) c.x = width/2;
            if(!isAnimating && Math.abs(c.y - height/2) < 2) c.y = height/2;
            c.draw(ctx, true, undefined, undefined, cardW, cardH);
        }
    } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
        roundRect(ctx, width/2 - cardW/2, height/2 - cardH/2, cardW, cardH, 10); ctx.stroke();
    }

    // Render Opponent Hand
    let oppSpread = Math.min(width / (opponentHand.length + 2), cardW * 0.7);
    let oppStart = width/2 - ((opponentHand.length - 1) * oppSpread) / 2;
    opponentHand.forEach((c, i) => {
        c.targetX = oppStart + i * oppSpread; c.targetY = -cardH * 0.4;
        c.draw(ctx, false, undefined, undefined, cardW, cardH);
    });

    // Darkness Overlay
    if (blindMode) { ctx.fillStyle = `rgba(0, 0, 0, ${blindIntensity})`; ctx.fillRect(0, 0, width, height); }

    // Render My Hand
    let pSpread = Math.min(width / (myHand.length + 1), cardW + 10);
    let pStart = width/2 - ((myHand.length - 1) * pSpread) / 2;
    let handYOffset = (blindMode && blindIntensity === 1.0) ? -50 : 0;
    
    myHand.forEach((c, i) => {
        if (!c.isDragging) {
            c.targetX = pStart + i * pSpread;
            let baseHeight = height - (cardH * 0.6); 
            if (c.isSelected) baseHeight = height - (cardH * 1.2);
            else if (c.isHovered) baseHeight = height - (cardH * 0.75);
            c.targetY = baseHeight + handYOffset;
        }
        
        if (i !== dragIdx) {
            // Parameter ke-2 (undefined) membiarkan kartu menentukan FaceUp/Down sendiri
            c.draw(ctx, undefined, undefined, undefined, cardW, cardH);
        }
    });

    // Render Dragged Card (Always on Top)
    if (dragIdx !== -1 && myHand[dragIdx]) {
        let c = myHand[dragIdx];
        c.draw(ctx, undefined, c.x, c.y, cardW, cardH);
    }

    particles.forEach(p => p.draw(ctx));
    floatingTexts.forEach(t => t.draw(ctx));

    if(gameState === 'PLAYING' && !isAnimating) {
        ctx.font = "bold 16px Orbitron"; ctx.fillStyle = turn === 'me' ? '#00FF00' : '#888'; ctx.textAlign = 'center';
        let txt = turn === 'me' ? "YOUR TURN (DRAG TO PLAY)" : "OPPONENT'S TURN";
        if(mustPlayBasic) txt = "COMBO: PLAY BASIC CARD!";
        if(blindMode && blindIntensity === 1.0 && turn === 'me') txt = "GUESS THE CARD!";
        ctx.fillText(txt, width/2, height/2 + cardH/2 + 50);
    }
}

function update() {
    for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); if (particles[i].life <= 0) particles.splice(i, 1); }
    for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(); if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1); }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

function resize() { 
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
    width = window.innerWidth; height = window.innerHeight;

    let refWidth = Math.min(width, 500);
    cardScale = refWidth / 500; 
    cardW = Math.max(60, 100 * cardScale); 
    cardH = cardW / CARD_RATIO;
}

function getCardAt(x, y) {
    for (let i = myHand.length - 1; i >= 0; i--) {
        let c = myHand[i];
        if (x > c.x - cardW/2 && x < c.x + cardW/2 && 
            y > c.y - cardH/2 && y < c.y + cardH/2) {
            return i;
        }
    }
    return -1;
}

function onPointerDown(e) {
    if (gameState !== 'PLAYING' || isAnimating || turn !== 'me') return;
    
    let rect = canvas.getBoundingClientRect();
    let x = (e.clientX || e.touches[0].clientX) - rect.left;
    let y = (e.clientY || e.touches[0].clientY) - rect.top;
    
    // Cek Tap di Deck (Area Tumpukan)
    let deckX = 60; let deckY = height/2;
    if (x > deckX - cardW/2 - 20 && x < deckX + cardW/2 + 20 &&
        y > deckY - cardH/2 - 20 && y < deckY + cardH/2 + 20) {
        if (!blindMode || blindIntensity < 0.5) requestDraw();
        return;
    }

    let idx = getCardAt(x, y);

    if (idx !== -1) {
        if (selectedIdx === idx) {
            dragIdx = idx;
            myHand[idx].isDragging = true;
            dragOffsetX = x - myHand[idx].x;
            dragOffsetY = y - myHand[idx].y;
        } else {
            if(selectedIdx !== -1 && myHand[selectedIdx]) myHand[selectedIdx].isSelected = false;
            selectedIdx = idx;
            myHand[idx].isSelected = true;
            playSound('pop');
        }
    } else {
        if(selectedIdx !== -1 && myHand[selectedIdx]) {
            myHand[selectedIdx].isSelected = false;
            selectedIdx = -1;
        }
    }
}

function onPointerMove(e) {
    let rect = canvas.getBoundingClientRect();
    let x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - rect.left;
    let y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - rect.top;

    if (dragIdx !== -1) {
        e.preventDefault(); 
        myHand[dragIdx].x = x - dragOffsetX;
        myHand[dragIdx].y = y - dragOffsetY;
    } else {
        let hovered = false;
        for (let i = myHand.length - 1; i >= 0; i--) {
            let c = myHand[i];
            if (!hovered && x > c.x - cardW/2 && x < c.x + cardW/2 && 
                y > c.y - cardH/2 && y < c.y + cardH/2) {
                c.isHovered = true; hovered = true;
            } else c.isHovered = false;
        }
    }
}

function onPointerUp(e) {
    if (dragIdx !== -1) {
        let c = myHand[dragIdx];
        c.isDragging = false;
        let dist = Math.hypot(c.x - width/2, c.y - height/2);
        
        if (dist < 150) {
            let success = playerInput(dragIdx);
            if (!success) {
                c.targetX = c.x; 
            }
        }
        dragIdx = -1;
    }
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

canvas.addEventListener('touchstart', onPointerDown, {passive: false});
canvas.addEventListener('touchmove', onPointerMove, {passive: false});
window.addEventListener('touchend', onPointerUp);

function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.closePath(); }
function showFloatingText(txt, x, y, c) { 
    floatingTexts.push({ text: txt, x: x, y: y, color: c, life: 1, update: function(){this.y-=1.5; this.life-=0.02;}, draw: function(ctx){
        ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.color; ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.font="bold 24px Orbitron"; ctx.strokeText(this.text,this.x,this.y); ctx.fillText(this.text,this.x,this.y); ctx.globalAlpha=1;
    }});
}

resize();
loop();
</script>
