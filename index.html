<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pistol Duel PvP</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        /* SCREEN: LOBBY & UI */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .hidden {
            display: none !important;
        }

        h1 { color: #333; margin-bottom: 30px; font-size: 2rem; text-transform: uppercase; letter-spacing: 5px; }
        
        .btn {
            background: #333;
            color: white;
            padding: 15px 40px;
            margin: 10px;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            width: 200px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        
        input {
            padding: 15px;
            font-size: 1.2rem;
            margin: 10px;
            border: 2px solid #333;
            border-radius: 5px;
            text-align: center;
            width: 250px;
        }

        #statusMsg { margin-top: 20px; color: #666; font-style: italic; }

        /* GAME CANVAS & HUD */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Pattern Kotak-kotak */
            background-color: #ffffff;
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 40px 40px;
            display: none; /* Hidden by default */
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .hp-box {
            width: 200px;
            background: rgba(0,0,0,0.1);
            border: 2px solid #333;
            height: 20px;
            position: relative;
        }
        
        .hp-bar {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.2s;
        }

        .player-label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="lobbyScreen" class="screen">
        <h1>DUEL PVP</h1>
        <button class="btn" onclick="showCreate()">Create Room</button>
        <button class="btn" onclick="showJoin()">Join Room</button>
    </div>

    <div id="createScreen" class="screen hidden">
        <h1>HOST GAME</h1>
        <input type="text" id="hostRoomName" placeholder="Nama Room (Unik)">
        <button class="btn" onclick="createRoom()">Buat & Tunggu</button>
        <button class="btn" style="background:#888" onclick="backToMain()">Kembali</button>
        <p id="createStatus"></p>
    </div>

    <div id="joinScreen" class="screen hidden">
        <h1>JOIN GAME</h1>
        <input type="text" id="joinRoomName" placeholder="Masukkan Nama Room">
        <button class="btn" onclick="joinRoom()">Cari & Masuk</button>
        <button class="btn" style="background:#888" onclick="backToMain()">Kembali</button>
        <p id="joinStatus"></p>
    </div>

    <div id="gameContainer">
        <div id="hud">
            <div>
                <div class="player-label">YOU <span id="myHpText">100%</span></div>
                <div class="hp-box"><div id="myHpBar" class="hp-bar"></div></div>
            </div>
            <div style="text-align: right;">
                <div class="player-label">ENEMY <span id="enemyHpText">100%</span></div>
                <div class="hp-box"><div id="enemyHpBar" class="hp-bar" style="float: right; background: #f44336;"></div></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
/**
 * KONFIGURASI GAME & NETWORKING
 */
const CONFIG = {
    rotationSpeed: 0.15,
    recoilForce: 8,
    bulletSpeed: 18,
    friction: 0.97,
    bounceFactor: 0.8,
    pistolScale: 0.8, // Skala diperkecil
    damage: 5
};

// Networking Globals
let peer = null;
let conn = null;
let isHost = false;
let myId = null;

// Game Globals
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;
let gameActive = false;
let isTouching = false;

// Entities
const player = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, hp: 100, color: '#333' };
const enemy = { x: -100, y: -100, angle: 0, hp: 100, visible: false }; // Enemy dikontrol oleh data network
let bullets = [];
let particles = [];

/* =========================================
   UI & LOBBY LOGIC
   ========================================= */

function backToMain() {
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
    document.getElementById('lobbyScreen').classList.remove('hidden');
}

function showCreate() {
    document.getElementById('lobbyScreen').classList.add('hidden');
    document.getElementById('createScreen').classList.remove('hidden');
}

function showJoin() {
    document.getElementById('lobbyScreen').classList.add('hidden');
    document.getElementById('joinScreen').classList.remove('hidden');
}

function createRoom() {
    const roomName = document.getElementById('hostRoomName').value.trim();
    if(!roomName) return alert("Isi nama room!");
    
    document.getElementById('createStatus').innerText = "Connecting to server...";
    
    // Init PeerJS dengan ID custom (nama room)
    peer = new Peer(roomName, { debug: 2 });

    peer.on('open', (id) => {
        document.getElementById('createStatus').innerText = `Room "${id}" dibuat! Menunggu lawan...`;
        isHost = true;
    });

    peer.on('connection', (c) => {
        // Lawan masuk
        conn = c;
        setupConnection();
    });

    peer.on('error', (err) => {
        document.getElementById('createStatus').innerText = "Error: Nama room mungkin sudah dipakai.";
    });
}

function joinRoom() {
    const roomName = document.getElementById('joinRoomName').value.trim();
    if(!roomName) return alert("Isi nama room!");

    document.getElementById('joinStatus').innerText = "Mencari room...";
    
    // Joiner tidak butuh ID spesifik, random saja
    peer = new Peer();

    peer.on('open', (id) => {
        // Connect ke Host
        conn = peer.connect(roomName);
        isHost = false;
        
        conn.on('open', () => {
            setupConnection();
        });

        conn.on('error', (err) => {
            document.getElementById('joinStatus').innerText = "Gagal connect ke room.";
        });
    });

    peer.on('error', (err) => {
        document.getElementById('joinStatus').innerText = "Connection Error.";
    });
}

function setupConnection() {
    console.log("Connected!");
    // Sembunyikan UI lobby, tampilkan game
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
    document.getElementById('gameContainer').style.display = 'block';
    
    initGame();

    // Handle Data Masuk
    conn.on('data', (data) => {
        handleNetworkData(data);
    });
}

/* =========================================
   GAME ENGINE
   ========================================= */

function resize() {
    // Membuat arena luas tapi tetap rasio 16:9 agar fair
    // Kita gunakan viewport window, tapi logic game menganggap area lebih "zoom out"
    // karena ukuran pistol (CONFIG.pistolScale) kita kecilkan.
    
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const ratio = 16/9;

    if (winW / winH > ratio) {
        height = winH;
        width = height * ratio;
    } else {
        width = winW;
        height = width / ratio;
    }
    
    canvas.width = width;
    canvas.height = height;

    // Reset posisi spawn
    if (gameActive && !isHost && player.x === 0) {
        // Joiner spawn kanan
        player.x = width * 0.8;
        player.y = height * 0.5;
    } else if (gameActive && isHost && player.x === 0) {
        // Host spawn kiri
        player.x = width * 0.2;
        player.y = height * 0.5;
    }
}

function initGame() {
    resize();
    gameActive = true;
    
    // Spawn positions
    if (isHost) {
        player.x = width * 0.2;
        player.y = height * 0.5;
        player.vx = 2; // Mulai bergerak
    } else {
        player.x = width * 0.8;
        player.y = height * 0.5;
        player.vx = -2;
        player.angle = Math.PI; // Hadap kiri
    }
    
    enemy.visible = true;
    updateHpUI();
    requestAnimationFrame(gameLoop);
    
    // Loop Kirim Data (30fps)
    setInterval(sendPlayerData, 1000/30);
}

function update() {
    if(!gameActive) return;

    // --- PLAYER PHYSICS ---
    if (isTouching) {
        // Freeze & Aim
        player.vx = 0;
        player.vy = 0;
    } else {
        // Spin & Move
        player.angle += CONFIG.rotationSpeed;
        player.x += player.vx;
        player.y += player.vy;
        
        // Friction
        player.vx *= CONFIG.friction;
        player.vy *= CONFIG.friction;
    }

    // Wall Bounce
    const r = 20 * CONFIG.pistolScale;
    if (player.x < r) { player.x = r; player.vx *= -CONFIG.bounceFactor; }
    if (player.x > width - r) { player.x = width - r; player.vx *= -CONFIG.bounceFactor; }
    if (player.y < r) { player.y = r; player.vy *= -CONFIG.bounceFactor; }
    if (player.y > height - r) { player.y = height - r; player.vy *= -CONFIG.bounceFactor; }

    // --- BULLETS ---
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += Math.cos(b.angle) * CONFIG.bulletSpeed;
        b.y += Math.sin(b.angle) * CONFIG.bulletSpeed;

        // Out of bounds
        if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
            bullets.splice(i, 1);
            continue;
        }

        // Collision Logic
        // Kita hanya mengecek peluru yang KITA tembak kena musuh atau tidak
        // (Client-side hit detection untuk shooter)
        if (b.owner === 'me') {
            const dist = Math.hypot(b.x - enemy.x, b.y - enemy.y);
            // Hitbox musuh kira-kira 30px
            if (dist < 30) {
                // HIT!
                bullets.splice(i, 1);
                createExplosion(enemy.x, enemy.y, '#ff0000');
                
                // Kirim event HIT ke musuh
                if(conn && conn.open) {
                    conn.send({ type: 'hit' });
                }
                
                // Update tampilan HP musuh lokal (hanya visual, sync asli via network)
                enemy.hp = Math.max(0, enemy.hp - CONFIG.damage);
                updateHpUI();
                continue;
            }
        }
    }

    // --- PARTICLES ---
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Clear & Outline Arena
    ctx.clearRect(0, 0, width, height);
    
    // Draw Enemy
    if (enemy.visible) {
        drawPistol(ctx, enemy.x, enemy.y, enemy.angle, '#f44336'); // Merah
    }

    // Draw Player
    drawPistol(ctx, player.x, player.y, player.angle, '#333'); // Hitam

    // Draw Bullets
    bullets.forEach(b => {
        ctx.fillStyle = (b.owner === 'me') ? '#000' : '#f00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function drawPistol(ctx, x, y, angle, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    
    // Skala Lebih Kecil sesuai Request
    const scale = (width * 0.0015) * CONFIG.pistolScale; 
    ctx.scale(scale, scale);

    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 5;

    // Grip
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.lineTo(-15, 40);
    ctx.lineTo(15, 40);
    ctx.lineTo(10, 10);
    ctx.fill();

    // Slide/Barrel
    ctx.fillStyle = color === '#333' ? '#555' : '#e57373'; // Sedikit lebih terang dari body
    ctx.fillRect(-30, -15, 70, 20);
    
    // Detail Slide
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    for(let i=0; i<3; i++) ctx.fillRect(-28 + (i*4), -12, 2, 14);

    // Barrel Hole
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(40, -5, 4, 0, Math.PI * 2);
    ctx.fill();

    // Center Pivot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function updateHpUI() {
    document.getElementById('myHpBar').style.width = player.hp + "%";
    document.getElementById('myHpText').innerText = player.hp + "%";
    
    document.getElementById('enemyHpBar').style.width = enemy.hp + "%";
    document.getElementById('enemyHpText').innerText = enemy.hp + "%";

    if(player.hp <= 0) gameOver("YOU LOSE");
    if(enemy.hp <= 0) gameOver("YOU WIN");
}

function gameOver(msg) {
    gameActive = false;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,width,height);
    ctx.fillStyle = '#fff';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(msg, width/2, height/2);
    setTimeout(() => {
        location.reload(); // Reset simple
    }, 3000);
}

/* =========================================
   NETWORKING LOGIC
   ========================================= */

function sendPlayerData() {
    if (!conn || !conn.open) return;
    conn.send({
        type: 'update',
        x: player.x,
        y: player.y,
        angle: player.angle,
        hp: player.hp
    });
}

function handleNetworkData(data) {
    if (data.type === 'update') {
        // Sync posisi musuh
        enemy.x = data.x; // Bisa ditambahkan interpolasi agar lebih halus
        enemy.y = data.y;
        enemy.angle = data.angle;
        // Enemy HP di-update berdasarkan data yang mereka kirim (source of truth diri sendiri)
        // Kecuali kita pakai logika shooter-authoritative
    }
    else if (data.type === 'shoot') {
        // Musuh nembak
        bullets.push({
            x: data.x,
            y: data.y,
            angle: data.angle,
            owner: 'enemy'
        });
        // Muzzle flash di musuh
        createExplosion(enemy.x + Math.cos(enemy.angle)*30, enemy.y + Math.sin(enemy.angle)*30, '#ffffaa', 3);
    }
    else if (data.type === 'hit') {
        // Kita kena tembak!
        player.hp -= CONFIG.damage;
        createExplosion(player.x, player.y, '#ff0000');
        updateHpUI();
        // Kirim update HP terbaru kita ke musuh segera
        sendPlayerData();
    }
}

/* =========================================
   INPUT & SHOOTING
   ========================================= */

function shoot() {
    // Posisi ujung laras
    const barrelLen = (width * 0.0015 * CONFIG.pistolScale) * 40; 
    const muzzleX = player.x + Math.cos(player.angle) * barrelLen;
    const muzzleY = player.y + Math.sin(player.angle) * barrelLen;

    // Tambah peluru lokal
    const bulletAngle = player.angle;
    bullets.push({
        x: muzzleX,
        y: muzzleY,
        angle: bulletAngle,
        owner: 'me'
    });

    // Recoil
    player.vx -= Math.cos(player.angle) * CONFIG.recoilForce;
    player.vy -= Math.sin(player.angle) * CONFIG.recoilForce;
    
    // FX
    createExplosion(muzzleX, muzzleY, '#ffffaa', 5);

    // Network: Beritahu musuh kita nembak
    if(conn && conn.open) {
        conn.send({
            type: 'shoot',
            x: muzzleX,
            y: muzzleY,
            angle: bulletAngle
        });
    }
}

function createExplosion(x, y, color, count=10) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color: color,
            size: Math.random() * 3
        });
    }
}

function handleStart(e) {
    if(!gameActive) return;
    if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    isTouching = true;
}

function handleEnd(e) {
    if(!gameActive) return;
    if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    if (isTouching) {
        isTouching = false;
        shoot();
    }
}

function gameLoop() {
    update();
    draw();
    if(gameActive) requestAnimationFrame(gameLoop);
}

// Events
window.addEventListener('mousedown', handleStart);
window.addEventListener('mouseup', handleEnd);
window.addEventListener('touchstart', handleStart, {passive: false});
window.addEventListener('touchend', handleEnd, {passive: false});
window.addEventListener('resize', resize);

</script>
</body>
</html>
