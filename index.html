<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wizard Duel: Fixed Controls</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { background: #1a1a1a; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: white; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay - Z-Index lebih tinggi dari canvas */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        /* Menu Screen */
        #menu { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; pointer-events: auto; z-index: 10;
        }
        input { padding: 10px; font-size: 20px; text-align: center; margin: 10px; width: 200px; border-radius: 5px; border: none; }
        button { 
            padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; 
            background: #6c5ce7; color: white; border: none; border-radius: 8px; font-weight: bold;
        }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        /* Fullscreen Btn */
        #fs-btn { position: absolute; bottom: 10px; right: 10px; padding: 5px 10px; background: #333; color: #fff; font-size: 12px; pointer-events: auto; z-index: 20; border: 1px solid #555; }

        /* Right Buttons */
        #btn-container {
            position: absolute; bottom: 50px; right: 40px;
            display: flex; flex-direction: column; gap: 20px; align-items: center;
            pointer-events: auto; /* Penting: agar tombol bisa dipencet */
        }
        
        .action-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid white;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black;
            backdrop-filter: blur(4px);
            position: relative;
        }
        
        #btn-attack { background: rgba(231, 76, 60, 0.4); }
        #btn-parry { background: rgba(46, 204, 113, 0.4); width: 60px; height: 60px; font-size: 12px; }

        /* Status */
        #status-msg { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; text-align: center; color: #ffd700; text-shadow: 0 0 5px black; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="status-msg">Menunggu Koneksi...</div>
        
        <div id="btn-container">
            <div id="btn-parry" class="action-btn">PARRY</div>
            <div id="btn-attack" class="action-btn">ATK</div>
        </div>

        <button id="fs-btn">Fullscreen</button>
    </div>

    <div id="menu">
        <h1>WIZARD DUEL</h1>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Top-Down Magic Battle</p>
        <button id="create-btn">Create Room</button>
        <div style="display: flex; align-items: center;">
            <input type="text" id="room-code" placeholder="4-Digit Code" maxlength="4">
            <button id="join-btn">Join</button>
        </div>
        <p id="menu-log" style="margin-top:20px; color: yellow; font-size: 14px;"></p>
    </div>

<script>
/**
 * KONFIGURASI GAME
 */
const CONFIG = {
    HP: 100,
    DMG_MELEE: 2,
    DMG_FIRE: 8,
    SPEED: 4,
    FIREBALL_SPEED: 9,
    PARRY_DURATION: 30, // frames
    CHARGE_TIME: 400, // ms untuk dianggap hold
    COLOR_P1: '#3498db',
    COLOR_P2: '#e74c3c'
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// --- STATE MANAGEMENT ---
let gameState = 'MENU';
let isHost = false;
let myId = null;
let conn = null;
let peer = null;

// --- INPUTS ---
const inputs = {
    move: { active: false, x: 0, y: 0, originX: 0, originY: 0, id: null }, 
    attack: { active: false, x: 0, y: 0, originX: 0, originY: 0, id: null, startTime: 0 }, 
    parry: false
};

// --- GAME OBJECTS ---
const particles = [];
const fireballs = [];

class Player {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.hp = 100; this.angle = 0; this.radius = 20;
        this.isParrying = false; this.parryTimer = 0;
        this.isCharging = false; this.chargeLevel = 0;
    }

    update(dt, inputData) {
        if (this.hp <= 0) return;

        // Movement
        if (inputData && inputData.moveActive) {
            this.x += inputData.moveX * CONFIG.SPEED;
            this.y += inputData.moveY * CONFIG.SPEED;
            if (!this.isCharging) {
                this.angle = Math.atan2(inputData.moveY, inputData.moveX);
            }
        }

        // Boundary
        this.x = Math.max(20, Math.min(width - 20, this.x));
        this.y = Math.max(20, Math.min(height - 20, this.y));

        // Parry Logic
        if (this.parryTimer > 0) {
            this.parryTimer--;
            this.isParrying = true;
        } else {
            this.isParrying = false;
        }
        
        // Charging Effect
        if (this.isCharging) {
            this.chargeLevel += 0.05;
            spawnParticle(this.x + Math.cos(this.angle)*30, this.y + Math.sin(this.angle)*30, 'orange', 1);
        } else {
            this.chargeLevel = 0;
        }
    }

    draw(ctx) {
        if (this.hp <= 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        
        // HP Bar
        ctx.fillStyle = 'black'; ctx.fillRect(-25, -45, 50, 8);
        ctx.fillStyle = this.hp > 30 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(-24, -44, 48 * (this.hp / 100), 6);

        ctx.rotate(this.angle);
        
        // Shadow
        ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.ellipse(0, 5, 15, 8, 0, 0, Math.PI*2); ctx.fill();

        // Body
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
        // Hat
        ctx.fillStyle = shadeColor(this.color); ctx.beginPath();
        ctx.moveTo(10, -5); ctx.lineTo(25, 0); ctx.lineTo(10, 5); ctx.fill();

        // Hands & Staff
        if (this.isParrying) {
            ctx.fillStyle = '#f1c40f'; ctx.globalAlpha = 0.4;
            ctx.beginPath(); ctx.arc(15, 0, 30, -Math.PI/2, Math.PI/2); ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#8e44ad'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(10, -15); ctx.lineTo(10, 15); ctx.stroke();
        } else {
            ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(30, 15); ctx.stroke();
            ctx.fillStyle = this.isCharging ? `hsl(${Math.random()*60 + 10}, 100%, 50%)` : '#e74c3c';
            ctx.beginPath(); ctx.arc(30, 15, 4 + (this.isCharging ? Math.random()*3 : 0), 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

class Fireball {
    constructor(x, y, angle, ownerId) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * CONFIG.FIREBALL_SPEED;
        this.vy = Math.sin(angle) * CONFIG.FIREBALL_SPEED;
        this.ownerId = ownerId;
        this.active = true;
        this.life = 100;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
        if (Math.random() > 0.3) { spawnParticle(this.x, this.y, 'orange', 2); spawnParticle(this.x, this.y, 'red', 1); }
        if (this.x < 0 || this.x > width) { this.vx *= -1; }
        if (this.y < 0 || this.y > height) { this.vy *= -1; }
        if (this.life <= 0) this.active = false;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y);
        const gradient = ctx.createRadialGradient(0, 0, 2, 0, 0, 15);
        gradient.addColorStop(0, '#ffff00'); gradient.addColorStop(0.4, '#ff4500'); gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
        ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

let p1 = new Player(100, 100, CONFIG.COLOR_P1);
let p2 = new Player(300, 300, CONFIG.COLOR_P2);
let myPlayer = p1;

// --- NETWORKING (Simple PeerJS) ---
const menuLog = document.getElementById('menu-log');

function initPeer(id = null) {
    const peerId = id || Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(peerId);
    peer.on('open', (id) => {
        myId = id; console.log('My ID:', id);
        if (gameState === 'MENU') {
            document.getElementById('room-code').value = id;
            if(isHost) menuLog.innerText = `Room Created! Code: ${id}`;
        }
    });
    peer.on('connection', (c) => {
        conn = c; setupConnection();
        menuLog.innerText = "Player Connected! Starting...";
        setTimeout(startGame, 1000);
    });
}

function joinRoom() {
    const code = document.getElementById('room-code').value;
    if (code.length !== 4) return alert("Enter 4-digit code");
    isHost = false;
    peer = new Peer();
    peer.on('open', () => { conn = peer.connect(code); setupConnection(); });
}

function setupConnection() {
    conn.on('open', () => {
        gameState = 'PLAY';
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('status-msg').innerText = "FIGHT!";
        if (isHost) {
            myPlayer = p1; p1.x = width * 0.2; p1.y = height/2; p2.x = width * 0.8; p2.y = height/2;
        } else { myPlayer = p2; }
    });
    conn.on('data', (data) => handleNetworkData(data));
}

function sendData(data) { if (conn && conn.open) conn.send(data); }

function handleNetworkData(data) {
    const enemy = isHost ? p2 : p1;
    if (data.type === 'sync') {
        enemy.x = data.x; enemy.y = data.y; enemy.angle = data.a;
        enemy.hp = data.hp; enemy.isParrying = data.parry; enemy.isCharging = data.charge;
    } else if (data.type === 'fireball') {
        fireballs.push(new Fireball(data.x, data.y, data.angle, isHost ? 'p2' : 'p1'));
    } else if (data.type === 'slash') {
        createSlashEffect(enemy.x, enemy.y, enemy.angle);
        if (checkMeleeHit(enemy, myPlayer) && !myPlayer.isParrying) {
            myPlayer.hp -= CONFIG.DMG_MELEE; spawnParticle(myPlayer.x, myPlayer.y, 'red', 5); shakeScreen(5);
        }
    }
}

// --- PERBAIKAN KONTROL SENTUH ---
// Kita attach listener ke 'window' atau 'canvas' agar bisa mendeteksi sentuhan menembus overlay
const touchTarget = document.getElementById('gameCanvas'); // Canvas adalah layer terbawah yang menerima input
const btnAttack = document.getElementById('btn-attack');
const btnParry = document.getElementById('btn-parry');

// Mencegah scroll/zoom default
document.body.addEventListener('touchstart', (e) => { if(e.target == canvas) e.preventDefault(); }, {passive: false});
document.body.addEventListener('touchmove', (e) => { if(e.target == canvas) e.preventDefault(); }, {passive: false});

// Handler untuk Canvas (Joystick Kiri)
touchTarget.addEventListener('touchstart', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const x = t.clientX;
        const y = t.clientY;
        
        // Hanya aktifkan joystick jika sentuhan di sisi kiri layar
        if (x < width / 2 && !inputs.move.active) {
            inputs.move.active = true;
            inputs.move.id = t.identifier;
            inputs.move.originX = x;
            inputs.move.originY = y;
            inputs.move.x = 0;
            inputs.move.y = 0;
        }
    }
}, {passive: false});

touchTarget.addEventListener('touchmove', (e) => {
    e.preventDefault(); // Stop scrolling
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        
        // Logic Joystick Kiri
        if (t.identifier === inputs.move.id) {
            const dx = t.clientX - inputs.move.originX;
            const dy = t.clientY - inputs.move.originY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 50;
            const angle = Math.atan2(dy, dx);
            const cappedDist = Math.min(dist, maxDist);
            
            inputs.move.x = Math.cos(angle) * (cappedDist / maxDist);
            inputs.move.y = Math.sin(angle) * (cappedDist / maxDist);
        }
        
        // Logic Tombol Attack (Drag Aiming)
        if (t.identifier === inputs.attack.id) {
            const rect = btnAttack.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            
            const dx = t.clientX - centerX;
            const dy = t.clientY - centerY;
            
            inputs.attack.x = dx;
            inputs.attack.y = dy;
            
            // Update arah karakter saat aiming
            if (Math.sqrt(dx*dx + dy*dy) > 20) {
                 myPlayer.angle = Math.atan2(dy, dx);
                 myPlayer.isCharging = true;
            }
        }
    }
}, {passive: false});

touchTarget.addEventListener('touchend', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === inputs.move.id) {
            inputs.move.active = false;
            inputs.move.id = null;
            inputs.move.x = 0; inputs.move.y = 0;
        }
        // Jika jari aiming dilepas (tapi aslinya trigger dari btnAttack, ini safety net)
        if (t.identifier === inputs.attack.id) {
            handleAttackRelease();
        }
    }
});

// Handler Tombol Attack
btnAttack.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    inputs.attack.active = true;
    inputs.attack.id = t.identifier;
    inputs.attack.startTime = Date.now();
    inputs.attack.originX = t.clientX;
    inputs.attack.originY = t.clientY;
});
btnAttack.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleAttackRelease();
});

function handleAttackRelease() {
    if (!inputs.attack.active) return;
    
    const duration = Date.now() - inputs.attack.startTime;
    const dist = Math.sqrt(inputs.attack.x*inputs.attack.x + inputs.attack.y*inputs.attack.y);
    
    if (duration < CONFIG.CHARGE_TIME && dist < 30) {
        performMelee();
    } else {
        performFireball();
    }
    
    inputs.attack.active = false;
    inputs.attack.id = null;
    inputs.attack.x = 0; inputs.attack.y = 0;
    myPlayer.isCharging = false;
}

btnParry.addEventListener('touchstart', (e) => { e.preventDefault(); performParry(); });

// --- ACTIONS & EFFECTS ---

function performMelee() {
    createSlashEffect(myPlayer.x, myPlayer.y, myPlayer.angle);
    sendData({ type: 'slash' });
}

function performFireball() {
    const angle = myPlayer.angle;
    const offset = 30;
    const fx = myPlayer.x + Math.cos(angle) * offset;
    const fy = myPlayer.y + Math.sin(angle) * offset;
    const fb = new Fireball(fx, fy, angle, isHost ? 'p1' : 'p2');
    fireballs.push(fb);
    sendData({ type: 'fireball', x: fx, y: fy, angle: angle });
}

function performParry() { myPlayer.parryTimer = CONFIG.PARRY_DURATION; }

function checkMeleeHit(attacker, victim) {
    const dx = victim.x - attacker.x; const dy = victim.y - attacker.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const ax = Math.cos(attacker.angle); const ay = Math.sin(attacker.angle);
    return (dist < 60 && ((dx * ax) + (dy * ay)) > 0);
}

function createSlashEffect(x, y, angle) {
    particles.push({ x: x + Math.cos(angle)*30, y: y + Math.sin(angle)*30, angle: angle, life: 10, type: 'slash' });
}

function spawnParticle(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 20+Math.random()*10, color: color, type: 'dot' });
    }
}

let shake = 0; function shakeScreen(n) { shake = n; }
function shadeColor(c){return c;}

// --- LOOP ---
function startGame() { gameState = 'PLAY'; resize(); loop(); }

function loop() {
    requestAnimationFrame(loop);
    
    ctx.fillStyle = '#222'; ctx.fillRect(0, 0, width, height);
    if (shake > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.9; if(shake<0.5)shake=0; }

    // Grid
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.beginPath();
    for(let x=0; x<width; x+=50) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
    for(let y=0; y<height; y+=50) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
    ctx.stroke();

    if (gameState === 'PLAY') {
        p1.update(16, isHost ? {moveActive:inputs.move.active, moveX:inputs.move.x, moveY:inputs.move.y} : null);
        p2.update(16, !isHost ? {moveActive:inputs.move.active, moveX:inputs.move.x, moveY:inputs.move.y} : null);
        
        if(conn && conn.open) {
            sendData({ type: 'sync', x: myPlayer.x, y: myPlayer.y, a: myPlayer.angle, hp: myPlayer.hp, parry: myPlayer.isParrying, charge: myPlayer.isCharging });
        }

        for (let i = fireballs.length - 1; i >= 0; i--) {
            let f = fireballs[i]; f.update(); f.draw(ctx);
            [p1, p2].forEach(p => {
                const dx = p.x - f.x; const dy = p.y - f.y;
                if (Math.sqrt(dx*dx + dy*dy) < p.radius + 15) {
                    if (p.isParrying) {
                         f.vx = -f.vx * 1.5; f.vy = -f.vy * 1.5; f.ownerId = (p === p1) ? 'p1' : 'p2';
                         spawnParticle(f.x, f.y, 'cyan', 5); f.x += f.vx*2; f.y += f.vy*2;
                    } else if (f.ownerId !== (p === p1 ? 'p1' : 'p2')) {
                        p.hp -= CONFIG.DMG_FIRE; spawnParticle(p.x, p.y, 'orange', 10); shakeScreen(8); f.active = false;
                    }
                }
            });
            if (!f.active) fireballs.splice(i, 1);
        }

        p1.draw(ctx); p2.draw(ctx);
        
        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.life--;
            if (p.type === 'slash') {
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                ctx.beginPath(); ctx.strokeStyle = `rgba(200, 200, 255, ${p.life/10})`; ctx.lineWidth = 3; ctx.arc(-20, 0, 40, -Math.PI/3, Math.PI/3); ctx.stroke(); ctx.restore();
            } else {
                p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.color; ctx.globalAlpha = p.life/20; ctx.fillRect(p.x, p.y, 3, 3);
            }
            if(p.life<=0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;

        // Draw Joystick
        if (inputs.move.active) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
            ctx.arc(inputs.move.originX, inputs.move.originY, 50, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.arc(inputs.move.originX + inputs.move.x*50, inputs.move.originY + inputs.move.y*50, 20, 0, Math.PI*2); ctx.fill();
        }
        
        // Aim Line
        if (myPlayer.isCharging) {
             ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
             ctx.moveTo(myPlayer.x, myPlayer.y);
             ctx.lineTo(myPlayer.x + Math.cos(myPlayer.angle)*200, myPlayer.y + Math.sin(myPlayer.angle)*200);
             ctx.stroke(); ctx.setLineDash([]);
        }
    }
    if (shake > 0) ctx.restore();
}

function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
window.addEventListener('resize', resize);
resize();

// Menu Listeners
document.getElementById('create-btn').addEventListener('click', () => { isHost = true; initPeer(); });
document.getElementById('join-btn').addEventListener('click', () => { isHost = false; joinRoom(); });
document.getElementById('fs-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
});
loop();
</script>
</body>
</html>
